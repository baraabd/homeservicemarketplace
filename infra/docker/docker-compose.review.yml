# Opt-in LOCAL scanner for the native API. Never mount identity or portfolio directories here.
# Uses the scanner image already exercised by the repository's ClamAV integration suites.
services:
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    ports:
      - '127.0.0.1:3310:3310'
    healthcheck:
      test: ['CMD-SHELL', 'clamdscan --ping 1 || exit 1']
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
