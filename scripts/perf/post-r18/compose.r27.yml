# R27 — disposable measurement services for the query and boot harnesses.
#
# Isolation is explicit, not implied by the project name: every container has
# an `hsm-r27-perf-*` name, host ports are unique to this lane, and no named
# volume is declared (each service uses an anonymous volume owned by this
# project only). Never point the harness at the developer's `hsm-postgres`.
#
#   docker compose -p hsm-r27-perf -f scripts/perf/post-r18/compose.r27.yml up -d --wait
#   docker compose -p hsm-r27-perf -f scripts/perf/post-r18/compose.r27.yml down -v
#
# The credentials below are fixed, low-value values for a loopback-only
# throwaway database; they are not used by any other environment.
name: hsm-r27-perf

services:
  postgres:
    image: postgres:16-alpine
    container_name: hsm-r27-perf-postgres
    labels: { hsm.r27.disposable: 'true' }
    environment:
      POSTGRES_USER: r27
      POSTGRES_PASSWORD: r27-local-only
      POSTGRES_DB: hsm_r27_perf
    # pg_stat_statements gives per-statement call counts for query-count
    # assertions; auto_explain records plans of statements slower than the
    # threshold during load, so slow plans are captured with real parameters.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements,auto_explain
      - -c
      - pg_stat_statements.track=all
      - -c
      - pg_stat_statements.max=10000
      - -c
      - auto_explain.log_min_duration=50ms
      - -c
      - auto_explain.log_analyze=on
      - -c
      - auto_explain.log_buffers=on
      - -c
      - auto_explain.log_format=json
      - -c
      - track_io_timing=on
    ports: ['127.0.0.1:54397:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U r27 -d hsm_r27_perf']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: hsm-r27-perf-redis
    labels: { hsm.r27.disposable: 'true' }
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports: ['127.0.0.1:63797:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.31.1
    container_name: hsm-r27-perf-mailpit
    labels: { hsm.r27.disposable: 'true' }
    ports: ['127.0.0.1:11027:1025', '127.0.0.1:18027:8025']
