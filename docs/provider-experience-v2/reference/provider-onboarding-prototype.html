  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {

.btn:focus-visible,
.nav-link:focus-visible {

    width: 44px;

    height: 44px;

  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {

  }

&lt;script&gt;

  const hsmIcon = (name,size=18) =&gt; `&lt;i data-lucide=&quot;${name}&quot; style=&quot;width:${size}px;height:${size}px&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;`;
  const hsmTop = (title,sub,progress,back=true) =&gt; `&lt;div class=&quot;hsm-topbar&quot;&gt;

  const hsmSticky = (label,next,secondary=&#x27;&#x27;) =&gt; `&lt;div class=&quot;hsm-sticky&quot;&gt;

    &lt;div class=&quot;hsm-save-state&quot;&gt;${hsmIcon(&#x27;cloud-check&#x27;,14)} ${hsmT(&#x27;حُفظت التغييرات • 12:42&#x27;,&#x27;Changes saved • 12:42&#x27;)}&lt;/div&gt;

  };
  function hsmShell(body,sticky=&#x27;&#x27;){ return `&lt;div class=&quot;hsm-phone-inner&quot; dir=&quot;${hsmDir()}&quot;&gt;${body}${sticky}&lt;/div&gt;`; }
  function hsmRenderScreen(id){
    if(id===&#x27;activate&#x27;) return hsmShell(`${hsmTop(hsmT(&#x27;ابدأ كمهني&#x27;,&#x27;Start as a provider&#x27;),&#x27;&#x27;,0,false)}&lt;div class=&quot;hsm-hero&quot;&gt;&lt;div class=&quot;hsm-hero-icon&quot;&gt;${hsmIcon(&#x27;briefcase&#x27;,26)}&lt;/div&gt;&lt;h2 class=&quot;hsm-heading&quot;&gt;${hsmT(&#x27;حوّل خبرتك إلى فرص عمل&#x27;,&#x27;Turn your skills into work&#x27;)}&lt;/h2&gt;&lt;p class=&quot;hsm-lead&quot;&gt;${hsmT(&#x27;أكمل ست مهام قصيرة، ثم أرسل طلبك للمراجعة. لن يظهر تنقل مساحة العمل قبل التفعيل.&#x27;,&#x27;Complete six short tasks, then submit your application. Workspace navigation stays hidden until activation.&#x27;)}&lt;/p&gt;&lt;/div&gt;&lt;main class=&quot;hsm-main&quot;&gt;&lt;div class=&quot;hsm-panel&quot;&gt;&lt;h2&gt;${hsmT(&#x27;ما الذي تحتاجه؟&#x27;,&#x27;What you need&#x27;)}&lt;/h2&gt;&lt;p&gt;${hsmT(&#x27;رقم هاتف، صورة شخصية، خدماتك، منطقة العمل، أوقاتك ونبذة عنك.&#x27;,&#x27;Phone number, profile photo, services, work area, availability and a short introduction.&#x27;)}&lt;/p&gt;&lt;/div&gt;&lt;/main&gt;`, `&lt;div class=&quot;hsm-sticky&quot;&gt;&lt;button class=&quot;hsm-primary&quot; type=&quot;button&quot; data-go=&quot;sync&quot;&gt;${hsmT(&#x27;تفعيل حساب المهني&#x27;,&#x27;Activate provider account&#x27;)}&lt;/button&gt;&lt;/div&gt;`);
