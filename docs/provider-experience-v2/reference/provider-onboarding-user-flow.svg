<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1540" viewBox="0 0 1680 1540" role="img" aria-labelledby="title desc">
  <title id="title">HomeServiceMarketplace Provider Onboarding V2 — complete user flow</title>
  <desc id="desc">Editable bilingual flow map covering account activation, six provider tasks, review, submission, moderation, recovery, and activation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <style>
      .bg{fill:#F8FAFC}.section{fill:#FFFFFF;stroke:#E2E8F0;stroke-width:1.5}.node{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5}.node-accent{fill:#EFF6FF;stroke:#2563EB;stroke-width:2}.node-success{fill:#F0FDF4;stroke:#15803D;stroke-width:2}.node-wait{fill:#EEF2FF;stroke:#4338CA;stroke-width:2}.node-warn{fill:#FFFBEB;stroke:#B45309;stroke-width:2}.node-danger{fill:#FEF2F2;stroke:#B91C1C;stroke-width:2}.title{font:700 34px Cairo,Inter,sans-serif;fill:#0F172A}.subtitle{font:400 16px Cairo,Inter,sans-serif;fill:#475569}.lane{font:700 19px Cairo,Inter,sans-serif;fill:#0F172A}.ar{font:700 16px Cairo,Inter,sans-serif;fill:#0F172A}.en{font:500 12px Inter,sans-serif;fill:#475569}.small{font:500 12px Cairo,Inter,sans-serif;fill:#475569}.accent{fill:#2563EB}.success{fill:#15803D}.wait{fill:#4338CA}.warn{fill:#B45309}.danger{fill:#B91C1C}.line{fill:none;stroke:#64748B;stroke-width:2;marker-end:url(#arrow)}.dash{fill:none;stroke:#94A3B8;stroke-width:2;stroke-dasharray:7 7;marker-end:url(#arrow)}.label{font:600 12px Cairo,Inter,sans-serif;fill:#475569}.num{font:700 13px Inter,sans-serif;fill:#FFFFFF}.badge{rx:11;ry:11}.diamond{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5}.note{font:600 12px Cairo,Inter,sans-serif;fill:#B45309}
    </style>
  </defs>
  <rect class="bg" width="1680" height="1540"/>
  <text class="title" x="840" y="56" text-anchor="middle">رحلة تسجيل المهني وإكمال الملف</text>
  <text class="subtitle" x="840" y="86" text-anchor="middle">Provider onboarding &amp; profile completion • Mobile-first • RTL/LTR • Server-owned state</text>

  <rect class="section" x="56" y="112" width="1568" height="240" rx="24"/>
  <text class="lane" x="1590" y="150" text-anchor="end">1. إنشاء الحساب ومزامنة الصلاحيات</text>
  <text class="en" x="1590" y="174" text-anchor="end">Account creation and role synchronization</text>
  <path class="line" d="M330 235 H465"/><path class="line" d="M735 235 H840"/><path class="line" d="M1040 235 H1180"/>
  <rect class="node-accent" x="90" y="184" width="240" height="102" rx="16" filter="url(#shadow)"/>
  <circle cx="120" cy="204" r="14" class="accent"/><text class="num" x="120" y="209" text-anchor="middle">1</text>
  <text class="ar" x="210" y="235" text-anchor="middle">تفعيل حساب المهني</text><text class="en" x="210" y="260" text-anchor="middle">Activate provider account</text>
  <rect class="node" x="465" y="184" width="270" height="102" rx="16"/>
  <circle cx="495" cy="204" r="14" class="accent"/><text class="num" x="495" y="209" text-anchor="middle">2</text>
  <text class="ar" x="600" y="235" text-anchor="middle">إنشاء الملف ودور provider</text><text class="en" x="600" y="260" text-anchor="middle">Create profile + role in DB</text>
  <path class="diamond" d="M840 235 L940 174 L1040 235 L940 296 Z"/>
  <text class="ar" x="940" y="228" text-anchor="middle">JWT محدث؟</text><text class="en" x="940" y="249" text-anchor="middle">Fresh role claim?</text>
  <text class="label success" x="1090" y="220" text-anchor="middle">نعم / Yes</text>
  <rect class="node-success" x="1180" y="184" width="360" height="102" rx="16"/>
  <circle cx="1210" cy="204" r="14" class="success"/><text class="num" x="1210" y="209" text-anchor="middle">3</text>
  <text class="ar" x="1360" y="235" text-anchor="middle">فتح لوحة المهام</text><text class="en" x="1360" y="260" text-anchor="middle">Open onboarding hub</text>
  <path class="line" d="M940 296 V320 H1100"/>
  <text class="label danger" x="985" y="316">لا / No — 403</text>
  <rect class="node-danger" x="1100" y="300" width="440" height="38" rx="12"/>
  <text class="small danger" x="1320" y="324" text-anchor="middle">Refresh session → retry once → never label 403 as “expired”</text>

  <rect class="section" x="56" y="380" width="1568" height="610" rx="24"/>
  <text class="lane" x="1590" y="420" text-anchor="end">2. ست مهام قصيرة — يمكن فتحها من اللوحة</text>
  <text class="en" x="1590" y="444" text-anchor="end">Six focused tasks — hub-driven and server ordered</text>
  <rect class="node-accent" x="650" y="466" width="380" height="92" rx="18" filter="url(#shadow)"/>
  <text class="ar" x="840" y="504" text-anchor="middle">لوحة إكمال الطلب</text><text class="en" x="840" y="530" text-anchor="middle">Application hub • 1 of 6 complete</text>
  <path class="line" d="M740 558 C700 590 390 590 330 635"/><path class="line" d="M800 558 C780 600 740 605 650 635"/><path class="line" d="M880 558 C900 600 940 605 1030 635"/><path class="line" d="M940 558 C980 590 1290 590 1350 635"/>
  <path class="dash" d="M700 558 C650 700 410 740 330 815"/><path class="dash" d="M980 558 C1030 700 1270 740 1350 815"/>
  <g>
    <rect class="node" x="140" y="635" width="380" height="116" rx="16"/>
    <circle cx="174" cy="670" r="15" class="success"/><text class="num" x="174" y="675" text-anchor="middle">1</text>
    <text class="ar" x="330" y="677" text-anchor="middle">البيانات الأساسية</text><text class="en" x="330" y="702" text-anchor="middle">Name • phone • direct photo upload</text><text class="small" x="330" y="727" text-anchor="middle">No duplicate home address</text>
  </g>
  <g>
    <rect class="node-wait" x="560" y="635" width="380" height="116" rx="16"/>
    <circle cx="594" cy="670" r="15" class="accent"/><text class="num" x="594" y="675" text-anchor="middle">2</text>
    <text class="ar" x="750" y="677" text-anchor="middle">الخدمات والخبرة</text><text class="en" x="750" y="702" text-anchor="middle">Search • stepper • transport cards</text><text class="note" x="750" y="727" text-anchor="middle">PENDING review ≠ incomplete user task</text>
  </g>
  <g>
    <rect class="node" x="980" y="635" width="380" height="116" rx="16"/>
    <circle cx="1014" cy="670" r="15" class="accent"/><text class="num" x="1014" y="675" text-anchor="middle">3</text>
    <text class="ar" x="1170" y="677" text-anchor="middle">نطاق العمل</text><text class="en" x="1170" y="702" text-anchor="middle">Starting point • automatic radius • map</text><text class="small" x="1170" y="727" text-anchor="middle">Transport determines initial range</text>
  </g>
  <g>
    <rect class="node" x="140" y="815" width="380" height="116" rx="16"/>
    <circle cx="174" cy="850" r="15" class="accent"/><text class="num" x="174" y="855" text-anchor="middle">4</text>
    <text class="ar" x="330" y="857" text-anchor="middle">ساعات العمل</text><text class="en" x="330" y="882" text-anchor="middle">Multi-day selection • apply hours</text><text class="small" x="330" y="907" text-anchor="middle">Unavailable toggle per selected days</text>
  </g>
  <g>
    <rect class="node-wait" x="650" y="815" width="380" height="116" rx="16"/>
    <circle cx="684" cy="850" r="15" class="accent"/><text class="num" x="684" y="855" text-anchor="middle">5</text>
    <text class="ar" x="840" y="857" text-anchor="middle">الملف العام ومعرض الأعمال</text><text class="en" x="840" y="882" text-anchor="middle">Bio • camera/gallery • crop • reorder</text><text class="small" x="840" y="907" text-anchor="middle">Broken media gets retry placeholder</text>
  </g>
  <g>
    <rect class="node" x="1160" y="815" width="380" height="116" rx="16"/>
    <circle cx="1194" cy="850" r="15" class="accent"/><text class="num" x="1194" y="855" text-anchor="middle">6</text>
    <text class="ar" x="1350" y="857" text-anchor="middle">المراجعة والإرسال</text><text class="en" x="1350" y="882" text-anchor="middle">Specific blockers • terms • sticky submit</text><text class="small" x="1350" y="907" text-anchor="middle">Orange “Complete now” cards, no dead end</text>
  </g>

  <path class="line" d="M330 931 C330 965 650 965 715 1035"/><path class="line" d="M750 751 C750 850 750 965 785 1035"/><path class="line" d="M1170 751 C1170 920 980 965 905 1035"/><path class="line" d="M840 931 V1035"/><path class="line" d="M1350 931 C1350 965 1030 965 965 1035"/>
  <rect class="node-success" x="650" y="1035" width="380" height="92" rx="18" filter="url(#shadow)"/>
  <text class="ar" x="840" y="1073" text-anchor="middle">6 من 6 — أكمل المستخدم واجبه</text><text class="en" x="840" y="1098" text-anchor="middle">Provider input complete • moderation stays separate</text>

  <rect class="section" x="56" y="1160" width="1568" height="324" rx="24"/>
  <text class="lane" x="1590" y="1200" text-anchor="end">3. الإرسال والمراجعة والتفعيل</text>
  <text class="en" x="1590" y="1224" text-anchor="end">Submission, moderation, recovery and work access</text>
  <path class="line" d="M290 1330 H410"/><path class="line" d="M690 1330 H810"/><path class="line" d="M1090 1330 H1210"/>
  <rect class="node-accent" x="90" y="1272" width="200" height="116" rx="16"/>
  <text class="ar" x="190" y="1318" text-anchor="middle">المراجعة النهائية</text><text class="en" x="190" y="1344" text-anchor="middle">Review + terms</text><text class="small" x="190" y="1368" text-anchor="middle">Fix-now deep links</text>
  <rect class="node-wait" x="410" y="1272" width="280" height="116" rx="16"/>
  <text class="ar" x="550" y="1318" text-anchor="middle">تم الإرسال</text><text class="en" x="550" y="1344" text-anchor="middle">Submitted • 24h expectation</text><text class="small" x="550" y="1368" text-anchor="middle">No workspace navigation</text>
  <path class="diamond" d="M810 1330 L950 1252 L1090 1330 L950 1408 Z"/>
  <text class="ar" x="950" y="1319" text-anchor="middle">قرار المراجعة</text><text class="en" x="950" y="1344" text-anchor="middle">Review decision</text>
  <rect class="node-success" x="1210" y="1272" width="360" height="116" rx="16"/>
  <text class="ar" x="1390" y="1318" text-anchor="middle">تفعيل الحساب والوصول للعمل</text><text class="en" x="1390" y="1344" text-anchor="middle">ACTIVE • workspace unlocked</text><text class="small success" x="1390" y="1368" text-anchor="middle">Navigation appears for the first time</text>
  <text class="label success" x="1150" y="1316">قبول / Approve</text>
  <path class="line" d="M950 1408 V1415"/>
  <path class="line" d="M620 1440 H550 V1388"/>
  <text class="label warn" x="790" y="1407">ملاحظة محددة / Action required</text>
  <rect class="node-warn" x="620" y="1415" width="360" height="50" rx="14"/>
  <text class="small warn" x="800" y="1445" text-anchor="middle">Preserve accepted data → return only to affected task</text>

  <g transform="translate(80 1498)">
    <rect width="16" height="16" rx="4" fill="#F0FDF4" stroke="#15803D"/><text class="small" x="26" y="13">Complete</text>
    <rect x="120" width="16" height="16" rx="4" fill="#EEF2FF" stroke="#4338CA"/><text class="small" x="146" y="13">Platform review</text>
    <rect x="300" width="16" height="16" rx="4" fill="#FFFBEB" stroke="#B45309"/><text class="small" x="326" y="13">Provider action</text>
    <rect x="480" width="16" height="16" rx="4" fill="#FEF2F2" stroke="#B91C1C"/><text class="small" x="506" y="13">Auth/session recovery</text>
  </g>
</svg>
