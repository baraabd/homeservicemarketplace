name: Sprint 12 verified source materialization
on:
  push:
    branches: [feat/sprint12-dispute-intake-foundation]
    paths: [.github/workflows/sprint12-materialize.yml]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify patch and create unreferenced Git objects only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          repo = 'baraabd/homeservicemarketplace'
          parent = 'e6b90deec6a132a2f842aeaaac1106355a43e66b'
          expected = '64dcb1178502fe287a030318a4e327b11faa5bfd'
          digest = '774e55f8376e04850f4697c76e729ee04099130b4cf57e41e7cf11641cb10f19'
          def git(*args):
              return subprocess.check_output(['git', *args]).decode().strip()
          assert os.environ['GITHUB_REPOSITORY'] == repo
          assert os.environ['GITHUB_REF'] == 'refs/heads/feat/sprint12-dispute-intake-foundation'
          head = git('rev-parse', 'HEAD')
          assert head == os.environ['GITHUB_SHA']
          assert git('rev-parse', 'HEAD^') == parent
          parts = [pathlib.Path(f'.sprint12-transfer/part{i}.b64') for i in range(4)]
          data = b''.join(p.read_bytes() for p in parts)
          assert len(data) == 47628
          patch = lzma.decompress(base64.b64decode(data, validate=True), memlimit=256 * 1024 * 1024)
          assert len(patch) == 149359 and hashlib.sha256(patch).hexdigest() == digest
          patch_path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'verified-sprint12.patch'
          patch_path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--index', '--check', '--whitespace=error-all', str(patch_path)], check=True)
          subprocess.run(['git', 'apply', '--index', '--whitespace=error-all', str(patch_path)], check=True)
          subprocess.run(['git', 'rm', '--', '.github/workflows/sprint12-workspace.yml', '.github/workflows/sprint12-materialize.yml', *map(str, parts)], check=True)
          assert git('write-tree') == expected
          def api(path, payload=None):
              request = urllib.request.Request('https://api.github.com/repos/' + repo + path,
                  data=None if payload is None else json.dumps(payload).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
                           'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          # No commit/ref/push operation: an authorized connector separately publishes
          # the reviewed tree after checking this receipt against the local tree.
          entries = []
          changed = git('diff', '--cached', '--name-status', head).splitlines()
          for row in changed:
              status, path = row.split('\t')
              assert status in ('A', 'M', 'D')
              assert not path.startswith('/') and '..' not in pathlib.PurePosixPath(path).parts
              if status == 'D':
                  entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': None})
                  continue
              mode, kind, local_sha = git('ls-files', '--stage', '--', path).split()[:3]
              assert mode == '100644'
              raw = pathlib.Path(path).read_bytes()
              blob_sha = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              result = api('/git/blobs', {'content': base64.b64encode(raw).decode(), 'encoding': 'base64'})
              assert result['sha'] == blob_sha
              entries.append({'path': path, 'mode': mode, 'type': 'blob', 'sha': blob_sha})
          base = api('/git/commits/' + head)['tree']['sha']
          tree = api('/git/trees', {'base_tree': base, 'tree': entries})['sha']
          assert tree == expected
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'sprint12-materialized-tree'
          out.mkdir()
          receipt = {'input_head': head, 'parent': parent, 'patch_sha256': digest,
                     'tree_sha': tree, 'changed_count': len(entries), 'refs_updated': False}
          (out / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sprint12-materialized-tree
          path: ${{ runner.temp }}/sprint12-materialized-tree/
          retention-days: 1
          if-no-files-found: error
