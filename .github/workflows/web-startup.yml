name: Web development startup

on:
  pull_request:
    branches: ['main', 'develop']
  push:
    branches: ['main', 'develop']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  startup:
    name: Dev browser startup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # Git Bash is available on Windows runners. Explicit bash enables -e and
    # pipefail for every run block; a later success cannot hide a failed build.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_db
      JWT_ACCESS_SECRET: ci_only_dummy_secret_at_least_32_chars_long
      VITE_API_URL: https://api.example.test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '24.21.0'
          cache: 'pnpm'
      - name: Verify exact runtime and safe-start regressions
        run: |
          node scripts/runtime/toolchain.cjs
          node --test scripts/runtime/toolchain.test.cjs scripts/dev/preflight.test.cjs scripts/dev/compose-smoke-context.test.cjs .github/scripts/merge-integrity.test.mjs
      - run: pnpm install --frozen-lockfile
      - name: Assert lockfile remains unchanged
        run: git diff --exit-code -- pnpm-lock.yaml
      - name: Build the real CommonJS contracts entry
        run: pnpm --filter @homeservicemarketplace/contracts build
      - name: Compile real API outputs and reproduce missing env.schema recovery
        run: |
          pnpm --filter @homeservicemarketplace/database exec prisma generate
          pnpm --filter @homeservicemarketplace/database build
          pnpm --filter @homeservicemarketplace/api exec tsc -p tsconfig.dev.json
          node scripts/dev/api-output-check.cjs verify
          node scripts/dev/api-output-check.cjs simulate-missing-output
          pnpm --filter @homeservicemarketplace/api exec tsc -p tsconfig.dev.json
          node scripts/dev/api-output-check.cjs verify
      - name: Build production API and web on this operating system
        run: |
          pnpm --filter @homeservicemarketplace/api build
          node scripts/dev/api-output-check.cjs verify
          pnpm --filter @homeservicemarketplace/web build
      - name: Install Chromium
        run: pnpm --filter @homeservicemarketplace/web exec playwright install --with-deps chromium
      - name: Reproduce the blank screen, then verify the real dev command
        run: pnpm --filter @homeservicemarketplace/web test:startup
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: web-startup-${{ matrix.os }}
          path: |
            apps/web/test-results/startup/
            apps/web/test-results/startup-report/
          retention-days: 14
          if-no-files-found: error
