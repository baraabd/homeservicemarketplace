name: R27 measured performance

on:
  pull_request:
    branches: ['develop']
  workflow_dispatch:
    inputs:
      repair_baseline_sha:
        description: 'Full immutable repair baseline SHA for manual runs'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: r27-performance-${{ github.ref }}
  cancel-in-progress: true

# Successor repair experiment on the owner-merged, dependency-patched source.
# G1 remains 40cdac5... in its immutable gate; its historical R27 comparison
# has a different lock digest and must not be relabelled comparable.
env:
  R27_BASELINE_SHA: 96e92825f9b65cf124317f43b55ce42fc97f5b49
  R27_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  measure:
    name: R27 real services (${{ matrix.source }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        source: [baseline, candidate, repair-baseline]
    defaults:
      run:
        working-directory: subject
    env:
      DATABASE_URL: postgresql://r27:r27-local-only@127.0.0.1:54397/hsm_r27_perf
      R27_HARNESS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      R27_REPAIR_BASELINE_SHA: ${{ github.event.pull_request.base.sha || inputs.repair_baseline_sha }}
      VITE_API_URL: http://127.0.0.1:4327
      E2E_REAL_API: http://127.0.0.1:4327
      E2E_MAILPIT: http://127.0.0.1:18027
      R27_CANDIDATE: ${{ matrix.source != 'baseline' && 'true' || 'false' }}
    steps:
      - name: Checkout measurement harness
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: harness
          persist-credentials: false
          fetch-depth: ${{ matrix.source == 'repair-baseline' && '0' || '1' }}
      - name: Validate immutable repair baseline
        if: matrix.source == 'repair-baseline'
        working-directory: harness
        run: |
          set -euo pipefail
          [[ "$R27_REPAIR_BASELINE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$R27_REPAIR_BASELINE_SHA" != "$R27_HARNESS_SHA" ]]
          test "$(git rev-parse HEAD)" = "$R27_HARNESS_SHA"
          git cat-file -e "${R27_REPAIR_BASELINE_SHA}^{commit}"
          git merge-base --is-ancestor "$R27_REPAIR_BASELINE_SHA" "$R27_HARNESS_SHA"
      - name: Checkout immutable runtime under test
        uses: actions/checkout@v5
        with:
          ref: ${{ matrix.source == 'baseline' && env.R27_BASELINE_SHA || matrix.source == 'repair-baseline' && env.R27_REPAIR_BASELINE_SHA || env.R27_CANDIDATE_SHA }}
          path: subject
          persist-credentials: false
      - name: Verify repair baseline checkout and dependency identity
        if: matrix.source == 'repair-baseline'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$R27_REPAIR_BASELINE_SHA"
          cmp --silent pnpm-lock.yaml ../harness/pnpm-lock.yaml
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: subject/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: subject/pnpm-lock.yaml
      - name: Apply the same measurement harness to both immutable runtimes
        run: |
          set -euo pipefail
          cp -R ../harness/scripts/perf/post-r18/. scripts/perf/post-r18/
          git diff --exit-code -- apps packages infra .github/workflows pnpm-lock.yaml
          cp ../harness/apps/web/playwright.r27.config.ts apps/web/playwright.r27.config.ts
          mkdir -p apps/web/r27-tests
          cp -R ../harness/apps/web/r27-tests/. apps/web/r27-tests/
          mkdir r27-evidence
      - run: pnpm install --frozen-lockfile
      - name: Harness regressions and source identity
        run: |
          set -euo pipefail
          node --test scripts/perf/post-r18/lib/*.test.mjs
          git diff --exit-code -- pnpm-lock.yaml
      - name: Start explicitly disposable services on this job's VM
        run: |
          set -euo pipefail
          for name in hsm-r27-perf-postgres hsm-r27-perf-redis hsm-r27-perf-mailpit; do
            if docker inspect "$name" >/dev/null 2>&1; then
              echo 'R27 refuses to reuse an existing container'
              exit 1
            fi
          done
          echo "R27_SERVICES_OWNED=true" >> "$GITHUB_ENV"
          docker compose -p hsm-r27-perf -f scripts/perf/post-r18/compose.r27.yml up -d --wait
      - name: Generate clean API artifacts and initialize only the lane database
        run: |
          set -euo pipefail
          pnpm --filter @homeservicemarketplace/database generate
          pnpm --filter @homeservicemarketplace/api build
          bash scripts/perf/post-r18/lane-db-reset.sh
      - name: Measure bundles, repeated production-policy boot and query hotlists
        run: |
          set -euo pipefail
          node scripts/perf/post-r18/bundle-report.mjs --label '${{ matrix.source }}' --out-json r27-evidence/bundle.json
          node scripts/perf/post-r18/api-boot.mjs --runs 5 --requests 30 --profile production --out-json r27-evidence/boot.json
          node scripts/perf/post-r18/api-boot-profile.mjs --out-json r27-evidence/boot-profile.json
          node scripts/perf/post-r18/query-profile.mjs --copies 300 ${{ matrix.source != 'baseline' && '--assert-repairs' || '' }} --out-json r27-evidence/query.json
      - name: Build and typecheck real browser harness
        run: |
          set -euo pipefail
          pnpm --filter @homeservicemarketplace/web build
          pnpm --filter @homeservicemarketplace/web exec tsc -p r27-tests/tsconfig.json --noEmit
          pnpm --filter @homeservicemarketplace/web exec playwright install --with-deps chromium
      - name: Production bundle browser measurements and fault recovery
        env:
          R27_BROWSER_MODE: production
        run: |
          set -euo pipefail
          bash scripts/perf/post-r18/lane-db-reset.sh
          pnpm --filter @homeservicemarketplace/web exec playwright test --config playwright.r27.config.ts
      - name: Development browser measurements on a freshly reset fixture
        env:
          R27_BROWSER_MODE: development
        run: |
          set -euo pipefail
          bash scripts/perf/post-r18/lane-db-reset.sh
          pnpm --filter @homeservicemarketplace/web exec playwright test --config playwright.r27.config.ts
      - name: Retain sanitized measurements only
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: r27-${{ matrix.source }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            subject/r27-evidence/*.json
            subject/r27-evidence/browser/**/*.json
            subject/r27-evidence/browser/**/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Remove only this job's disposable services
        if: always() && env.R27_SERVICES_OWNED == 'true'
        run: docker compose -p hsm-r27-perf -f scripts/perf/post-r18/compose.r27.yml down -v

  acceptance:
    name: R27 comparable measurements and unchanged budgets
    needs: measure
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every measurement job to succeed
        env:
          MEASURE_RESULT: ${{ needs.measure.result }}
        run: test "$MEASURE_RESULT" = success
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.R27_CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Download this run's exact-head baseline
        uses: actions/download-artifact@v6
        with:
          name: r27-baseline-${{ env.R27_CANDIDATE_SHA }}
          path: r27-acceptance/baseline
      - name: Download this run's exact-head candidate
        uses: actions/download-artifact@v6
        with:
          name: r27-candidate-${{ env.R27_CANDIDATE_SHA }}
          path: r27-acceptance/candidate
      - name: Compare unchanged report semantics and require complete evidence
        run: |
          set -euo pipefail
          node --test .github/scripts/r27-acceptance.test.mjs
          node scripts/perf/post-r18/compare-reports.mjs \
            --baseline r27-acceptance/baseline \
            --candidate r27-acceptance/candidate \
            --out-json r27-acceptance/comparison.json
          node .github/scripts/r27-acceptance.mjs \
            --comparison r27-acceptance/comparison.json \
            --baseline "$R27_BASELINE_SHA" --candidate "$R27_CANDIDATE_SHA"
      - name: Enforce the original candidate query and bundle ceilings
        run: |
          set -euo pipefail
          node scripts/perf/post-r18/check-budgets.mjs \
            --bundle r27-acceptance/candidate/bundle.json \
            --queries r27-acceptance/candidate/query.json \
            | tee r27-acceptance/candidate-budgets.txt
      - name: Retain acceptance findings including failures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: r27-acceptance-${{ env.R27_CANDIDATE_SHA }}
          path: |
            r27-acceptance/comparison.json
            r27-acceptance/candidate-budgets.txt
          if-no-files-found: error
          retention-days: 14
