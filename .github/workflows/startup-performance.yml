name: Real application startup performance

on:
  pull_request:
    branches: ['main', 'develop']
  push:
    branches: ['main', 'develop']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: startup-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Real Seeker Provider Admin startup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hsm_startup_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
      mailpit:
        image: axllent/mailpit:v1.31.1
        ports: ['1025:1025', '8025:8025']
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hsm_startup_ci
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      SMTP_FROM: noreply@example.test
      FRONTEND_URL: http://127.0.0.1:4173
      CORS_ORIGINS: http://127.0.0.1:4173
      COOKIE_SECURE: 'false'
      COOKIE_SAMESITE: lax
      AUTH_REQUIRE_EMAIL_VERIFICATION: 'true'
      AUTH_REGISTER_THROTTLE_LIMIT: '40'
      AUTH_OTP_VERIFY_THROTTLE_LIMIT: '80'
      # Only isolated shared-IP fixture budgets change. Normal server guards,
      # browser login/OTP, account counters and authorization stay enabled.
      GLOBAL_THROTTLE_LIMIT: '5000'
      # The benchmark compares valid sessions, not expired refresh-token reuse
      # across independently cloned measurement contexts. This is CI-only.
      JWT_ACCESS_TTL_SECONDS: '1800'
      VERIFICATION_ENFORCED: 'true'
      WORK_ACCESS_ENFORCED: 'true'
      HSM_STARTUP_PERFORMANCE: isolated-ci
      HSM_MEASUREMENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      E2E_REAL_API: http://127.0.0.1:4010
      E2E_MAILPIT: http://127.0.0.1:8025
      E2E_BASE_URL: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '24.21.0'
          cache: pnpm
      - name: Generate ephemeral authentication secret
        run: |
          secret="$(openssl rand -hex 48)"
          echo "::add-mask::$secret"
          echo "JWT_ACCESS_SECRET=$secret" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: Verify browser error classification and interaction gates
        run: node --test apps/web/scripts/startup-error-policy.test.mjs apps/web/scripts/startup-interaction.test.mjs
      - name: Generate, migrate and seed the disposable database
        run: |
          set -euo pipefail
          printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .env
          pnpm --filter @homeservicemarketplace/database generate
          pnpm --filter @homeservicemarketplace/database migrate:deploy
          pnpm --filter @homeservicemarketplace/database build
          pnpm --filter @homeservicemarketplace/database seed
      - name: Build the real API and production browser bundle
        env:
          VITE_API_URL: http://127.0.0.1:4010
          VITE_PROVIDER_ONBOARDING_V2: 'true'
        run: |
          pnpm --filter @homeservicemarketplace/api build
          pnpm --filter @homeservicemarketplace/web build
          pnpm --filter @homeservicemarketplace/web typecheck:e2e
      - name: Install real Chromium
        run: pnpm --filter @homeservicemarketplace/web exec playwright install --with-deps chromium
      - name: Start the isolated API and built SPA
        run: |
          set -euo pipefail
          NODE_ENV=development APP_ENV=test PORT=4010 node apps/api/dist/main.js > /tmp/hsm-startup-api.log 2>&1 &
          pnpm --filter @homeservicemarketplace/web exec vite preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/hsm-startup-web.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4010/health/ready >/dev/null && curl -sf http://127.0.0.1:4173/login >/dev/null && curl -sf http://127.0.0.1:8025/api/v1/messages >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo 'Isolated measurement services did not become ready; raw logs are not uploaded'
          exit 1
      - name: Measure real first and repeat loads with authenticated role data
        run: |
          pnpm --filter @homeservicemarketplace/web exec playwright test \
            e2e/startup-performance.real-api.spec.ts \
            --project=chromium-desktop --workers=1 --retries=0 --reporter=line \
            --output=test-results/startup-runner
      - name: Retain sanitized measurements only
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: real-startup-performance-${{ github.event.pull_request.head.sha || github.sha }}
          path: apps/web/test-results/startup-performance/*.json
          if-no-files-found: warn
          retention-days: 14
