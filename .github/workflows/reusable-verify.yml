name: Verify

# Reusable verification suite — the static quality gate for every branch.
#
# Sprint 4 consolidation. `ci.yml` (main + develop) and `staging-ci.yml`
# (develop) each carried their OWN copy of these five jobs. The copies had
# already drifted: only ci.yml's verify-web emitted the JUnit report that makes
# a failure diagnosable, and only ci.yml asserted the lockfile is unchanged by
# install. Two definitions of "verified" is one too many, so this is now the
# single definition and callers just call it.
#
# Called with:
#   jobs:
#     verify:
#       uses: ./.github/workflows/reusable-verify.yml

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node major version to verify against. Keep in step with .nvmrc, the Volta pin, the devcontainer image, and the Dockerfile base.'
        type: string
        required: false
        default: '20'

permissions:
  contents: read

env:
  NODE_VERSION: ${{ inputs.node-version }}
  # Placeholder values used only to satisfy zod env validation and Prisma's
  # schema loader in jobs that never open a real connection. Any job that DOES
  # need a live service declares its own.
  CI_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_db
  CI_JWT_SECRET: ci_only_dummy_secret_at_least_32_chars_long

jobs:
  install:
    name: Install & lockfile integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Assert the lockfile is unchanged by install
        # `--frozen-lockfile` already fails on a mismatch; this catches the
        # subtler case of an install that rewrites the file in place.
        run: git diff --exit-code -- pnpm-lock.yaml

  verify-contracts:
    name: Verify Contracts
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build contracts
        run: pnpm --filter @homeservicemarketplace/contracts build

  verify-database:
    name: Verify Database
    runs-on: ubuntu-latest
    needs: verify-contracts
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # The database package scripts wrap `dotenv -e ../../.env -- prisma`.
      # Neither command below connects to a real database.
      - name: Stub DATABASE_URL for prisma
        run: echo "DATABASE_URL=${{ env.CI_DATABASE_URL }}" > .env
      - name: Validate prisma schema
        run: pnpm --filter @homeservicemarketplace/database prisma:validate
      - name: Generate prisma client
        run: pnpm --filter @homeservicemarketplace/database generate
      - name: Typecheck database
        run: pnpm --filter @homeservicemarketplace/database typecheck
      - name: Build database
        run: pnpm --filter @homeservicemarketplace/database build

  verify-api:
    name: Verify API (lint / typecheck / unit / build)
    runs-on: ubuntu-latest
    needs: verify-database
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Stub env for prisma + nest config validation
        run: |
          {
            echo "DATABASE_URL=${{ env.CI_DATABASE_URL }}"
            echo "JWT_ACCESS_SECRET=${{ env.CI_JWT_SECRET }}"
          } > .env
      # Runners are isolated: the client generated by verify-database does not
      # carry across, and the api's build:deps needs it.
      - name: Generate prisma client (job-local)
        run: pnpm --filter @homeservicemarketplace/database generate
      - name: Lint api
        run: pnpm --filter @homeservicemarketplace/api lint
      - name: Typecheck api
        run: pnpm --filter @homeservicemarketplace/api typecheck
      - name: Test api
        run: pnpm --filter @homeservicemarketplace/api test
      - name: Build api
        run: pnpm --filter @homeservicemarketplace/api build

  verify-web:
    name: Verify Web (lint / typecheck / unit / build)
    runs-on: ubuntu-latest
    needs: verify-contracts
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Lint web
        run: pnpm --filter @homeservicemarketplace/web lint
      - name: Typecheck web
        run: pnpm --filter @homeservicemarketplace/web typecheck
      - name: Test web
        # Emit a machine-readable report alongside the console output. Twice now
        # a web test has failed here and been diagnosable only by guesswork:
        # the job log is the sole record, and reading it needs repo admin, so
        # whoever triages the failure may not be able to see it at all. The
        # JUnit file below is uploaded on failure and names the test, the
        # assertion, and the stack — no privileges required.
        # `test:ci` is `test` plus a JUnit report. It is a separate script
        # because pnpm's `--` passthrough does not survive `--filter` and the
        # extra flags were silently dropped.
        run: pnpm --filter @homeservicemarketplace/web test:ci
      - name: Upload the web test report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: web-test-report
          path: apps/web/vitest-report.xml
          retention-days: 7
          if-no-files-found: warn
      - name: Build web
        env:
          VITE_API_URL: https://api.example.com
        run: pnpm --filter @homeservicemarketplace/web build
