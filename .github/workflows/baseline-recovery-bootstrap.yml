name: Bootstrap post-R12 security baseline recovery

on:
  push:
    branches: ['fix/develop-post-r12-security-baseline']
    paths: ['.github/workflows/baseline-recovery-bootstrap.yml']

permissions:
  contents: write

concurrency:
  group: baseline-recovery-bootstrap
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_ENV: test
      APP_ENV: test
      DATABASE_URL: postgresql://127.0.0.1:5432/hsm_generation_only
      JWT_ACCESS_SECRET: ci_only_dummy_secret_at_least_32_chars_long
      AUTH_ANTI_ENUM_DELAY_MS: '0'
      OUTBOX_WORKER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/develop-post-r12-security-baseline
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24.21.0'
          package-manager-cache: false

      - name: Install exact current baseline and capture Jest discovery
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          mkdir -p "$RUNNER_TEMP/baseline-recovery"
          pnpm --filter @homeservicemarketplace/api exec jest --listTests --json > "$RUNNER_TEMP/baseline-recovery/before.json"

      - name: Apply the validated Jest 30 candidate to tracked source
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @homeservicemarketplace/api add --save-dev --save-exact \
            jest@30.5.2 @types/jest@30.0.0 ts-jest@29.4.9
          node <<'NODE'
          const fs = require('node:fs');
          const file = '.github/workflows/ci.yml';
          const before = fs.readFileSync(file, 'utf8');
          const legacy = '--testPathPattern=evidence-retention.integration';
          const count = before.split(legacy).length - 1;
          if (count !== 1) throw new Error(`Expected one legacy Jest flag, found ${count}`);
          fs.writeFileSync(file, before.replace(legacy, '--testPathPatterns=evidence-retention.integration'));
          NODE
          rm -f .github/workflows/security-jest30-candidate.yml
          pnpm install --frozen-lockfile

      - name: Prove discovery is identical and vulnerable chain is absent
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @homeservicemarketplace/api exec jest --version
          pnpm --filter @homeservicemarketplace/api exec jest --listTests --json > "$RUNNER_TEMP/baseline-recovery/after.json"
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const assert = require('node:assert/strict');
          const normalize = (file) => JSON.parse(fs.readFileSync(file, 'utf8'))
            .map((p) => path.relative(process.cwd(), p).replaceAll('\\', '/')).sort();
          const before = normalize(process.env.RUNNER_TEMP + '/baseline-recovery/before.json');
          const after = normalize(process.env.RUNNER_TEMP + '/baseline-recovery/after.json');
          assert.deepEqual(after, before, 'Jest 30 must discover exactly the same test files');
          const lock = fs.readFileSync('pnpm-lock.yaml', 'utf8');
          assert(!/^\s{2}(?:braces|micromatch)@/m.test(lock), 'braces/micromatch package remains');
          assert(!/^\s+(?:braces|micromatch):/m.test(lock), 'braces/micromatch dependency edge remains');
          console.log(JSON.stringify({testFiles: after.length, discovery: 'identical'}));
          NODE

      - name: Keep the zero-finding dependency policy unchanged
        shell: bash
        run: |
          set -euo pipefail
          pnpm security:audit:test
          pnpm security:audit
          pnpm security:audit:prod

      - name: Verify API compatibility with explicit test-only environment
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @homeservicemarketplace/database generate
          pnpm --filter @homeservicemarketplace/api typecheck
          pnpm --filter @homeservicemarketplace/api lint
          pnpm --filter @homeservicemarketplace/api build
          pnpm --filter @homeservicemarketplace/api exec jest --maxWorkers=2

      - name: Validate tracked diff
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/baseline-recovery-bootstrap.yml
          rm -f audit-full.json audit-production.json
          git status --short
          git diff --check
          node <<'NODE'
          const {execFileSync} = require('node:child_process');
          const allowed = new Set([
            'apps/api/package.json',
            'pnpm-lock.yaml',
            '.github/workflows/ci.yml',
            '.github/workflows/security-jest30-candidate.yml',
            '.github/workflows/baseline-recovery-bootstrap.yml',
          ]);
          const changed = execFileSync('git', ['diff', '--name-only', 'HEAD'], {encoding:'utf8'})
            .trim().split('\n').filter(Boolean);
          for (const file of changed) {
            if (!allowed.has(file)) throw new Error('Unexpected tracked change: ' + file);
          }
          NODE

      - name: Stage validated candidate source for transfer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/baseline-candidate/.github/workflows" "$RUNNER_TEMP/baseline-candidate/apps/api"
          cp apps/api/package.json "$RUNNER_TEMP/baseline-candidate/apps/api/package.json"
          cp pnpm-lock.yaml "$RUNNER_TEMP/baseline-candidate/pnpm-lock.yaml"
          cp .github/workflows/ci.yml "$RUNNER_TEMP/baseline-candidate/.github/workflows/ci.yml"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/baseline-candidate/parent.txt"

      - name: Upload validated candidate source
        uses: actions/upload-artifact@v6
        with:
          name: validated-baseline-source
          path: ${{ runner.temp }}/baseline-candidate/
          if-no-files-found: error
          retention-days: 7
