name: Dependency remediation bootstrap

# Temporary preparation only; removed before final PR acceptance.
on:
  push:
    branches: ['fix/security-full-dependency-audit-20260917']
    paths: ['.github/workflows/security-dependency-bootstrap.yml']
permissions:
  contents: read
concurrency:
  group: security-dependency-bootstrap
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'baraabd/homeservicemarketplace' && github.ref == 'refs/heads/fix/security-full-dependency-audit-20260917'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'
          package-manager-cache: false
      - name: Connect the zero-finding policy to the required security job
        run: |
          mkdir -p /tmp/security-gate
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path('package.json')
          data = json.loads(p.read_text())
          data['scripts'].update({
              'security:audit': 'node scripts/security/dependency-audit.cjs',
              'security:audit:prod': 'node scripts/security/dependency-audit.cjs --prod',
              'security:audit:test': 'node --test scripts/security/dependency-audit.test.cjs',
          })
          p.write_text(json.dumps(data, indent=2) + '\n')
          p = pathlib.Path('.github/workflows/ci.yml')
          text = p.read_text()
          start = '      - name: Production dependency audit (ZERO high or critical)\n'
          end = '      - name: Secret scan\n'
          if text.count(start) != 1 or text.count(end) != 1:
              raise SystemExit('CI audit anchors moved; refusing an ambiguous edit')
          replacement = '''      - name: Dependency audit policy regression tests
                  run: pnpm security:audit:test

                - name: Full dependency audit (ZERO findings at every severity)
                  # Tooling and dev dependencies are part of the supply chain too.
                  # Registry failures and missing/filtered reports must fail closed.
                  if: always()
                  run: pnpm security:audit

                - name: Production dependency audit (ZERO findings at every severity)
                  if: always()
                  run: pnpm security:audit:prod

                - name: Upload complete dependency audit evidence
                  if: always()
                  uses: actions/upload-artifact@v6
                  with:
                    name: dependency-audit
                    path: |
                      audit-full.json
                      audit-production.json
                    retention-days: 30
                    if-no-files-found: error

          '''
          # The first line already has the intended indentation. Remove the
          # Python heredoc's extra ten spaces from the remaining YAML lines.
          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.split('\n'))
          p.write_text(text[:text.index(start)] + replacement + text[text.index(end):])
          PY
      - name: Install audited lockfile and format only changed acceptance files
        run: |
          pnpm install --frozen-lockfile
          pnpm exec prettier --write package.json .github/workflows/ci.yml scripts/security/dependency-audit.cjs scripts/security/dependency-audit.test.cjs docs/security/DEPENDENCY_REMEDIATION_2026_09_17.md
      - name: Exercise the permanent gate and retain both raw audit scopes
        run: |
          set -o pipefail
          pnpm security:audit:test | tee /tmp/security-gate/policy-tests.log
          pnpm security:audit
          pnpm security:audit:prod
          cp audit-full.json audit-production.json /tmp/security-gate/
          git diff --check
          python - <<'PY'
          import os,pathlib,subprocess,tarfile
          allowed = ['package.json', '.github/workflows/ci.yml', 'scripts/security/dependency-audit.cjs', 'scripts/security/dependency-audit.test.cjs', 'docs/security/DEPENDENCY_REMEDIATION_2026_09_17.md']
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          if not changed or not changed <= set(allowed):
              raise SystemExit('Unexpected changes: ' + repr(changed))
          with tarfile.open('/tmp/security-gate/changes.tar','w') as archive:
              for filename in allowed:
                  archive.add(filename, arcname=filename, recursive=False)
          pathlib.Path('/tmp/security-gate/expected-sha.txt').write_text(os.environ['GITHUB_SHA'])
          pathlib.Path('/tmp/security-gate/changes.diff').write_bytes(subprocess.check_output(['git','diff']))
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: security-gate-preparation
          path: /tmp/security-gate/
          retention-days: 14
          if-no-files-found: error

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # No project/dependency code runs in this write-permission job.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: security-gate-preparation
          path: /tmp/security-gate
      - name: Validate and publish only the prepared acceptance files
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,pathlib,subprocess,tarfile
          allowed = {'package.json','.github/workflows/ci.yml','scripts/security/dependency-audit.cjs','scripts/security/dependency-audit.test.cjs','docs/security/DEPENDENCY_REMEDIATION_2026_09_17.md'}
          if pathlib.Path('/tmp/security-gate/expected-sha.txt').read_text() != os.environ['EXPECTED_HEAD']:
              raise SystemExit('Evidence belongs to a different revision')
          with tarfile.open('/tmp/security-gate/changes.tar') as archive:
              members = archive.getmembers()
              if {m.name for m in members} != allowed or len(members) != len(allowed):
                  raise SystemExit('Unexpected prepared file set')
              for m in members:
                  if not m.isfile() or m.size > 200000:
                      raise SystemExit('Invalid prepared file')
                  pathlib.Path(m.name).write_bytes(archive.extractfile(m).read())
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          if not changed or not changed <= allowed:
              raise SystemExit('Unexpected final diff')
          PY
          branch='fix/security-full-dependency-audit-20260917'
          current=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$current" = "$EXPECTED_HEAD"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package.json .github/workflows/ci.yml scripts/security/dependency-audit.cjs scripts/security/dependency-audit.test.cjs docs/security/DEPENDENCY_REMEDIATION_2026_09_17.md
          git commit -m 'fix(ci): require zero advisories across full and production dependency trees'
          authorization=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $authorization" push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD
