name: PR 137 acceptance wiring preflight (not for merge)

on:
  push:
    branches: ['work/pr137-schema-preflight-232f5a1']
    paths: ['.github/workflows/pr137-schema-preflight.yml']

permissions:
  contents: read

jobs:
  acceptance-wiring:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: '61f5bf7ee14c3e432abb16a67a54a05c456e3579'
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '24.21.0'
          cache: pnpm
      - name: Add regression for all three integrated sprint journeys
        run: |
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          path = Path('.github/scripts/merge-integrity.test.mjs')
          data = path.read_bytes()
          assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == '118ab766e36dcced8c569873aaed609ad3f90ba1'
          extra = '''
          test('CI retains the actual R12, R13 and R14 real-browser journeys', () => {
            const ci = read('.github/workflows/ci.yml');
            for (const [spec, artifact] of [
              ['r12-booking-communication.real-api.spec.ts', 'r12-booking-communication-evidence'],
              ['r13-support.real-api.spec.ts', 'r13-support-evidence'],
              ['r14-budget-authority.real-api.spec.ts', 'r14-budget-authority-evidence'],
            ]) {
              assert.ok(ci.includes(`e2e/${spec}`), `Missing real-browser execution: ${spec}`);
              assert.ok(ci.includes(`name: ${artifact}`), `Missing retained evidence: ${artifact}`);
            }
          });
          '''
          import textwrap
          path.write_text(data.decode() + '\n' + textwrap.dedent(extra).lstrip())
          PY
      - name: Prove the old CI omits the required R14 execution
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const {spawnSync} = require('node:child_process');
          const result = spawnSync(process.execPath, ['--test', '--test-name-pattern=CI retains', '.github/scripts/merge-integrity.test.mjs'], {encoding:'utf8'});
          assert.ifError(result.error);
          assert.equal(result.status, 1);
          assert.match(result.stdout + result.stderr, /Missing real-browser execution: r14-budget-authority/);
          console.log('REPRODUCED: R14 source exists but its mandatory real-browser CI step was lost.');
          NODE
      - name: Restore the unchanged approved R14 step after R13
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          from pathlib import Path
          import base64, hashlib, json, os, urllib.request
          path = Path('.github/workflows/ci.yml')
          original = path.read_bytes()
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          assert blob(original) == '4cff3b662874b867e6025ebdd22e276a139d6f18'
          approved_sha = 'd86e12c7b4b1ee94c432ef3a7679c8d8b1e662bc'
          req = urllib.request.Request(
              'https://api.github.com/repos/baraabd/homeservicemarketplace/git/blobs/' + approved_sha,
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json'},
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              response = json.load(response)
          approved = base64.b64decode(response['content'])
          assert blob(approved) == approved_sha
          start = '      - name: Accept R14 budget authority through the build-flagged bundle\n'
          end = '      - name: Bring in the visual evidence, so the counters can be complete\n'
          old = original.decode()
          approved = approved.decode()
          assert start not in old
          assert old.count(end) == 1
          block = approved[approved.index(start):approved.index(end, approved.index(start))]
          assert 'e2e/r14-budget-authority.real-api.spec.ts' in block
          assert 'name: r14-budget-authority-evidence' in block
          updated = old.replace(end, block + end)
          assert updated.replace(block, '', 1) == old
          path.write_text(updated)
          PY
      - name: Verify pinned source and all merge regressions
        run: |
          node scripts/runtime/toolchain.cjs
          pnpm install --frozen-lockfile
          pnpm exec prettier --write .github/scripts/merge-integrity.test.mjs .github/workflows/ci.yml
          node --test .github/scripts/merge-integrity.test.mjs
          git diff --check
          git diff --exit-code -- pnpm-lock.yaml packages/database/prisma/schema.prisma packages/database/prisma/migrations
      - name: Publish verified immutable CI and regression blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          from pathlib import Path
          import base64, hashlib, json, os, urllib.request
          result = {}
          for path in ['.github/workflows/ci.yml', '.github/scripts/merge-integrity.test.mjs']:
              data = Path(path).read_bytes()
              expected = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              req = urllib.request.Request(
                  'https://api.github.com/repos/baraabd/homeservicemarketplace/git/blobs',
                  data=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode(),
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json', 'Content-Type':'application/json'},
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  returned = json.load(response)
              assert returned['sha'] == expected
              result[path] = expected
          print('VERIFIED_CI_BLOBS=' + json.dumps(result, sort_keys=True))
          PY
