name: CI

# Verification for pull requests into BOTH long-lived branches, and for pushes
# to them. This workflow does NOT deploy: no production secrets, no image
# pushes, no environment bindings. A green run means "safe to merge"; promotion
# to a hosted environment stays a manual, out-of-band action.
#
# Sprint 01 remediation (Phase 8) added the permanent gates that keep the
# findings closed:
#
#   integration-e2e   real Postgres / Redis, so the D-1 cross-instance
#                     rate-limit proof and the session integration tests
#                     actually run rather than being skipped.
#   browser-e2e       Playwright in a real Chromium — the RTL, badge, and
#                     geometry assertions that a DOM shim cannot make.
#   docker-image      a COLD `--no-cache` build plus a production boot, health
#                     check, and graceful SIGTERM. D-7 and D-8 were both
#                     "the image does not start" defects; only building and
#                     booting it catches them.
#   compose-smoke     the Compose app profile end to end: the migration job
#                     completes before the API starts, readiness is green, and
#                     the media-upload and OTP flows really work. Sprint 04.
#   security-scan     dependency audit, secret scan, and a container image
#                     scan that FAILS on unmitigated critical/high findings.

on:
  pull_request:
    branches: ['main', 'develop']
  push:
    branches: ['main', 'develop']
  workflow_dispatch:

# Least privilege: read-only checkout, nothing else. `security-events: write`
# is deliberately NOT granted — the scan jobs fail the build directly instead
# of uploading SARIF, so a fork PR cannot write to the security tab.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  # Placeholder values used only to satisfy zod env validation and Prisma's
  # schema loader in jobs that never open a real connection. Any job that DOES
  # need a live service declares its own.
  CI_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_db
  CI_JWT_SECRET: ci_only_dummy_secret_at_least_32_chars_long

jobs:
  # ── the shared verification suite ─────────────────────────────────────────
  # Sprint 4: these five jobs (install, contracts, database, api, web) used to
  # be written out here AND again in staging-ci.yml. They now live in one
  # reusable definition that both long-lived branches call, so "verified"
  # cannot mean two different things depending on which branch you targeted.
  #
  # This single caller expands into the same five jobs in the checks list; the
  # ci-gate below depends on the caller, which succeeds only if all five did.
  verify:
    name: Verify
    uses: ./.github/workflows/reusable-verify.yml
    with:
      node-version: '20'

  # ── integration / E2E against REAL services ───────────────────────────────
  # Without these containers the DB- and Redis-gated suites skip themselves,
  # which is exactly how a cross-instance rate-limit defect survives a green
  # pipeline.
  integration-e2e:
    name: Integration & E2E (real Postgres / Redis)
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: homeservicemarketplace
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/homeservicemarketplace
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      JWT_ACCESS_SECRET: ci_only_dummy_secret_at_least_32_chars_long
      # The gates the suites read to decide whether to run for real.
      RUN_DB_INTEGRATION: '1'
      RUN_REDIS_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Wait until Postgres and Redis actually serve queries
        # The runner's own health gate is necessary but not sufficient.
        # Postgres answers pg_isready while initdb is still finishing and then
        # drops the connection. That window is short, which is why it shows
        # up as an intermittent first-migration failure rather than a clean one.
        #
        # Each probe below is a real round trip, and it fails HERE with an
        # obvious message instead of surfacing as an inscrutable prisma or jest
        # error three steps later. Postgres is probed from the runner, so the
        # check also proves the published port; Redis has no client on the
        # runner, so its own container runs the probe.
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          # Each attempt is evaluated inside an `if`, so `set -e` cannot abort
          # the retry loop on the first (entirely expected) miss.
          await_service() {
            local name="$1"; shift
            for _ in $(seq 1 60); do
              if "$@" >/dev/null 2>&1; then
                echo "$name is serving"
                return 0
              fi
              sleep 2
            done
            echo "::error::$name did not become ready within 120s"
            return 1
          }
          await_service Postgres psql -h localhost -U postgres -d homeservicemarketplace -c 'SELECT 1'
          await_service Redis docker exec ${{ job.services.redis.id }} redis-cli ping
      - name: Write .env for the dotenv-wrapped prisma scripts
        run: |
          {
            echo "DATABASE_URL=$DATABASE_URL"
            echo "REDIS_HOST=$REDIS_HOST"
            echo "REDIS_PORT=$REDIS_PORT"
            echo "JWT_ACCESS_SECRET=$JWT_ACCESS_SECRET"
          } > .env
      - name: Generate prisma client
        run: pnpm --filter @homeservicemarketplace/database generate
      - name: Assert migrations and schema.prisma agree
        # Catches "the schema was edited but no migration was written", which is
        # how the Dispute FK drift went unnoticed for a whole sprint. It needs a
        # real shadow database, which is why it lives in this job.
        env:
          PGPASSWORD: postgres
        run: |
          # Prisma replays the migrations into this database; it must exist and
          # must not be the one the app uses.
          psql -h localhost -U postgres -c 'DROP DATABASE IF EXISTS hsm_shadow'
          psql -h localhost -U postgres -c 'CREATE DATABASE hsm_shadow'
          cd packages/database
          DIFF=$(pnpm exec prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "postgresql://postgres:postgres@localhost:5432/hsm_shadow" \
            --script 2>&1)
          echo "$DIFF"
          if ! echo "$DIFF" | grep -q "This is an empty migration"; then
            echo "::error::schema.prisma and prisma/migrations disagree - a migration is missing"
            exit 1
          fi
      - name: Apply migrations
        run: pnpm --filter @homeservicemarketplace/database migrate:deploy
      - name: Build database package
        run: pnpm --filter @homeservicemarketplace/database build
      - name: Seed baseline roles / permissions
        run: pnpm --filter @homeservicemarketplace/database seed
      - name: Verify the constraint migrations against empty and upgraded databases
        # Sprint 2. The constraint migrations are forward-only and they touch
        # existing rows, so "it applied cleanly" is not evidence for either
        # half of that: on an empty database every remediation branch and every
        # refusal branch is dead code. This builds throwaway databases and
        # drives all four scenarios, including the two where the migration is
        # supposed to REFUSE and stop the deploy.
        #
        # Deliberately its own step, before the suite rather than beside it.
        # The harness drops and creates databases on the same server the
        # integration specs are using; running the two concurrently starved
        # them badly enough to produce spurious failures (one suite took 96
        # minutes instead of 6 seconds). Steps within a job are sequential,
        # which is the isolation this needs.
        run: pnpm --filter @homeservicemarketplace/database verify:migrations
      - name: Run the API suite with the DB- and Redis-gated specs ENABLED
        run: pnpm --filter @homeservicemarketplace/api test
      - name: Upload API logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: integration-logs
          path: |
            apps/api/*.log
            npm-debug.log*
          retention-days: 7
          if-no-files-found: ignore

  # ── real browser ──────────────────────────────────────────────────────────
  browser-e2e:
    name: Browser E2E (Playwright / Chromium)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @homeservicemarketplace/web exec playwright install --with-deps chromium
      - name: Build the web app
        # Hoisted out of playwright.config.ts's webServer command. It used to run
        # inside the 300s server-startup budget, so a slow cold build and a
        # server that failed to bind produced the identical "Timed out waiting
        # for config.webServer" message. As its own step it has its own timing,
        # its own log, and its own failure.
        env:
          # The suite stubs every /v1/** call; this only satisfies the
          # production build's required-env check.
          VITE_API_URL: https://api.example.com
        run: pnpm --filter @homeservicemarketplace/web build
      - name: Run the browser suite (mobile / tablet / desktop)
        env:
          VITE_API_URL: https://api.example.com
          E2E_API_URL: https://api.example.com
          # Serve the artefact the step above produced.
          E2E_PREBUILT: '1'
        run: pnpm --filter @homeservicemarketplace/web test:e2e
      # Admin review tests also capture successful EN/AR responsive screens for
      # visual review. Retain those alongside failure traces on every run.
      - name: Upload Playwright report and visual evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # ── the approved design, measured ─────────────────────────────────────────
  # Sprint 09B.29 Phase 5B. The visual gate produced its evidence only on a
  # developer's machine, which meant the one check that can tell whether the
  # shipped screens still match the approved prototype was never a merge
  # blocker. A gate that does not run in CI is a gate somebody remembers to run.
  #
  # It is its own job rather than a step inside browser-e2e because it is a
  # different kind of check with a different failure mode: browser-e2e asserts
  # behaviour, this one asserts appearance and accessibility against a frozen
  # reference, and its artifacts are images a human has to look at.
  phase5-visual:
    name: Phase 5 visual, responsive and accessibility gate
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @homeservicemarketplace/web exec playwright install --with-deps chromium
      - name: Build the web app
        env:
          VITE_API_URL: https://api.example.com
        run: pnpm --filter @homeservicemarketplace/web build
      - name: Capture and measure the 18 approved states
        # Single worker, deliberately. The matrix captures screenshots, and
        # parallel browsers on a 2-core runner contend for CPU badly enough to
        # change antialiasing at the margins — which is a difference in the
        # measurement apparatus, not in the product.
        env:
          VITE_API_URL: https://api.example.com
          E2E_API_URL: https://api.example.com
          E2E_PREBUILT: '1'
          E2E_PHASE5: '1'
        run: |
          pnpm --filter @homeservicemarketplace/web exec playwright test \
            phase5-visual phase5-responsive phase5-reference \
            --project=chromium-desktop --workers=1
      - name: Re-derive the ledger counters from the artifacts just produced
        # The suite writes evidence; this reads it back and recomputes every
        # ratio from the decoded pixels. A green Playwright run whose artifacts
        # do not survive independent verification is not evidence.
        run: pnpm --filter @homeservicemarketplace/web exec vitest run phase5-
      - name: Upload the visual evidence
        # ALWAYS, not only on failure. A passing run's contact sheets are what
        # a reviewer needs in order to agree that the screens are right — the
        # ratio says they are identical to the reference, not that the
        # reference was the right thing to copy.
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase5-visual-evidence
          path: |
            apps/web/test-results/phase5-visual/
          retention-days: 14
          if-no-files-found: warn

  # ── the six task journeys, against a real server ──────────────────────────
  # Sprint 09B.29 Phase 5B. The persistence suite has driven all six task
  # screens against a real API for two sprints and the Phase 5 ledger reported
  # route 0/6 and persistence 0/6 the whole time — because no spec ever wrote
  # the markers it reads. This job is where that evidence is produced.
  #
  # It is deliberately a SEPARATE job from browser-e2e: that one stubs every
  # /v1/** call and can never earn route credit, and mixing the two in one job
  # would put a stubbed run and an un-stubbed one in the same artifact tree.
  phase5-real-api:
    name: Phase 5 real-route and persistence evidence
    runs-on: ubuntu-latest
    # Also on phase5-visual, so this job can hold BOTH halves of the evidence.
    # The counters are only meaningful together: route credit requires
    # presentation credit, and presentation credit lives in PROVISIONAL_UI,
    # which this job does not produce. Before this dependency existed, the
    # visual job could print 6/6, 0/6, 0/6 and this one 0/6, 0/6, 0/6, and
    # neither number was the project's — the real 6/6/6 existed only on a
    # developer's machine, where both artifact sets happened to be present.
    needs: [verify, phase5-visual]
    # Each test registers a real account, waits on a real SMTP delivery and
    # drives a full browser journey. Generous per test, bounded per job.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: homeservicemarketplace
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports: ['1025:1025', '8025:8025']
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/homeservicemarketplace
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      JWT_ACCESS_SECRET: ci_only_dummy_secret_at_least_32_chars_long
      JWT_ISSUER: hsm-api
      JWT_AUDIENCE: hsm-clients
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      COOKIE_SECURE: 'false'
      COOKIE_SAMESITE: lax
      # Every test registers a fresh account; Sprint 1's 5/IP/hour limiter
      # would throttle the suite out halfway and the failure would look like an
      # auth bug. Raised for this job only.
      AUTH_REGISTER_THROTTLE_LIMIT: '200'
      # And every one of those accounts must then VERIFY, against a 20/minute
      # limiter that had no override until Sprint 09B.29 Phase 5B. The pair
      # being inconsistent is what broke this job: accounts could be created
      # freely and then not confirmed. Eight of that run's twelve failures were
      # the same 429 and the rest were downstream of it — including a PATCH
      # rejected for a malformed `version`, which was simply the unauthenticated
      # draft read one call earlier.
      #
      # Production refuses to boot above 20 (env.validation.ts), so this value is
      # reachable only in a disposable environment like this one.
      AUTH_OTP_VERIFY_THROTTLE_LIMIT: '400'
      # The coarse 100/minute backstop every route sits behind. Twenty-three
      # real browser journeys from one runner address is not abuse, but at this
      # layer it is indistinguishable from it — and it was the SECOND 429 this
      # job hit, on GET /onboarding/draft, once the OTP limiter was fixed. The
      # route-level guards in front of it are untouched by this value, and
      # production refuses to boot above 100.
      GLOBAL_THROTTLE_LIMIT: '5000'
      # The browser is served from 4173 and talks to the API on 4010, so the
      # API has to allow that origin or every request arrives anonymous.
      CORS_ORIGINS: http://127.0.0.1:4173,http://localhost:4173
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Generate prisma client
        run: pnpm --filter @homeservicemarketplace/database generate
      - name: Apply migrations
        run: pnpm --filter @homeservicemarketplace/database migrate:deploy
      - name: Build database package
        run: pnpm --filter @homeservicemarketplace/database build
      - name: Seed baseline roles / permissions
        run: pnpm --filter @homeservicemarketplace/database seed
      - name: Build the API
        run: pnpm --filter @homeservicemarketplace/api build
      - name: Build the web app with V2 ON at BUILD time
        # The flag is baked into the bundle rather than set through a storage
        # override, and the route marker says so. Route evidence answers "does
        # the SHIPPED artefact serve V2" — a localStorage override answers a
        # different question, and the ledger would be recording the wrong one.
        env:
          VITE_API_URL: http://127.0.0.1:4010
          VITE_PROVIDER_ONBOARDING_V2: 'true'
        run: pnpm --filter @homeservicemarketplace/web build
      - name: Install Chromium
        run: pnpm --filter @homeservicemarketplace/web exec playwright install --with-deps chromium
      - name: Start the API
        run: |
          node apps/api/dist/main.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4010/health/live >/dev/null; then
              echo "API is up"; exit 0
            fi
            sleep 1
          done
          echo "::error::API did not become healthy"; cat /tmp/api.log; exit 1
        env:
          NODE_ENV: development
          PORT: '4010'
      - name: Serve the built SPA
        # Started here rather than by playwright's webServer, which the config
        # omits entirely for a real-API run. `--host 127.0.0.1` is load-bearing:
        # without it vite binds `localhost`, which on this runner resolves to
        # [::1] only, and every poll of 127.0.0.1 is refused by a server that is
        # running perfectly well on another interface.
        run: |
          pnpm --filter @homeservicemarketplace/web exec vite preview \
            --host 127.0.0.1 --port 4173 --strictPort > /tmp/preview.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4173/ >/dev/null; then
              echo "SPA is up"; exit 0
            fi
            sleep 1
          done
          echo "::error::vite preview did not come up"; cat /tmp/preview.log; exit 1
      - name: Drive the six task journeys and record the evidence
        env:
          E2E_REAL_API: http://127.0.0.1:4010
          E2E_MAILPIT: http://127.0.0.1:8025
          E2E_BASE_URL: http://127.0.0.1:4173
        run: |
          pnpm --filter @homeservicemarketplace/web exec playwright test \
            e2e/provider-onboarding-v2-real-api.spec.ts \
            e2e/provider-onboarding-v2-persistence.spec.ts \
            --project=chromium-desktop --workers=1
      - name: Bring in the visual evidence, so the counters can be complete
        # Into the same tree this job wrote its own markers to. The ledger keeps
        # the two namespaces separate by path — PROVISIONAL_UI for the stubbed
        # visual run, FINAL_REAL_API for this one — so they can share a parent
        # directory without either being able to satisfy the other's checks.
        uses: actions/download-artifact@v6
        with:
          name: phase5-visual-evidence
          path: apps/web/test-results/phase5-visual/
      - name: Re-derive the counters from BOTH halves of the evidence
        # The suite writes evidence; this reads it back and re-checks every
        # claim in it — including that the recorded values agree with the
        # database read. A green Playwright run whose markers do not survive
        # independent verification is not evidence.
        run: pnpm --filter @homeservicemarketplace/web exec vitest run phase5-
      - name: Assert the counters are what the branch claims
        # The report PRINTS; this FAILS. A counter nobody asserts is a number in
        # a log, and this project has already had one pinned at 0/6 for a whole
        # phase by an argument rather than by absent evidence.
        run: |
          pnpm --filter @homeservicemarketplace/web exec vitest run \
            phase5-ledger-report --reporter=verbose 2>&1 | tee /tmp/counters.log
          # The exit status above belongs to tee; the assertion is the grep.
          for line in \
            "presentation migrated:       6/6" \
            "production-route integrated: 6/6" \
            "real-API persisted:          6/6"
          do
            if ! grep -qF "$line" /tmp/counters.log; then
              echo "::error::expected counter line not found: $line"
              grep -E "migrated:|integrated:|persisted:" /tmp/counters.log || true
              exit 1
            fi
          done
          echo "all three counters are 6/6"
      - name: Upload the real-API evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase5-real-api-evidence
          path: |
            apps/web/test-results/phase5-visual/FINAL_REAL_API/
            /tmp/api.log
            /tmp/preview.log
          retention-days: 14
          if-no-files-found: warn

  # Admin acceptance has its own disposable services. Sharing the Provider
  # job's Redis carried its completed login workload into the next suite and
  # exhausted the unchanged 10/IP/minute login budget before Admin began.
  # Isolation preserves both fresh UI/OTP entry and the real server limiter.
  admin-review-real-api:
    name: Admin review real-route and persistence evidence
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: homeservicemarketplace
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports: ['1025:1025', '8025:8025']
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/homeservicemarketplace
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      JWT_ACCESS_SECRET: ci_only_dummy_secret_at_least_32_chars_long
      JWT_ISSUER: hsm-api
      JWT_AUDIENCE: hsm-clients
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      COOKIE_SECURE: 'false'
      COOKIE_SAMESITE: lax
      # Same disposable-stack budgets as Provider acceptance. The login route
      # retains its hard 10/IP/minute limit. This single-worker suite performs
      # eight Admin UI logins, one memoized Admin API login and one Provider
      # UI login; no rate bucket is cleared or altered between tests.
      AUTH_REGISTER_THROTTLE_LIMIT: '200'
      AUTH_OTP_VERIFY_THROTTLE_LIMIT: '400'
      GLOBAL_THROTTLE_LIMIT: '5000'
      CORS_ORIGINS: http://127.0.0.1:4173,http://localhost:4173
      VERIFICATION_ENFORCED: 'true'
      WORK_ACCESS_ENFORCED: 'true'
      # Genuine uploaded bytes pass through the running worker. This test
      # scanner is forbidden in production and is not malware-detection proof.
      EVIDENCE_SCANNER_DRIVER: test
      EVIDENCE_SCAN_WORKER_ENABLED: 'true'
      EVIDENCE_SCAN_INTERVAL_MS: '1000'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Generate prisma client
        run: pnpm --filter @homeservicemarketplace/database generate
      - name: Apply migrations
        run: pnpm --filter @homeservicemarketplace/database migrate:deploy
      - name: Build database package
        run: pnpm --filter @homeservicemarketplace/database build
      - name: Seed baseline roles / permissions
        run: pnpm --filter @homeservicemarketplace/database seed
      - name: Build the API
        run: pnpm --filter @homeservicemarketplace/api build
      - name: Build the web app with V2 ON at BUILD time
        # The flag is baked into the bundle rather than set through a storage
        # override, and the route marker says so. Route evidence answers "does
        # the SHIPPED artefact serve V2" — a localStorage override answers a
        # different question, and the ledger would be recording the wrong one.
        env:
          VITE_API_URL: http://127.0.0.1:4010
          VITE_PROVIDER_ONBOARDING_V2: 'true'
        run: pnpm --filter @homeservicemarketplace/web build
      - name: Install Chromium
        run: pnpm --filter @homeservicemarketplace/web exec playwright install --with-deps chromium
      - name: Start the API
        run: |
          node apps/api/dist/main.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4010/health/live >/dev/null; then
              echo "API is up"; exit 0
            fi
            sleep 1
          done
          echo "::error::API did not become healthy"; cat /tmp/api.log; exit 1
        env:
          NODE_ENV: development
          PORT: '4010'
      - name: Serve the built SPA
        # Started here rather than by playwright's webServer, which the config
        # omits entirely for a real-API run. `--host 127.0.0.1` is load-bearing:
        # without it vite binds `localhost`, which on this runner resolves to
        # [::1] only, and every poll of 127.0.0.1 is refused by a server that is
        # running perfectly well on another interface.
        run: |
          pnpm --filter @homeservicemarketplace/web exec vite preview \
            --host 127.0.0.1 --port 4173 --strictPort > /tmp/preview.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4173/ >/dev/null; then
              echo "SPA is up"; exit 0
            fi
            sleep 1
          done
          echo "::error::vite preview did not come up"; cat /tmp/preview.log; exit 1
      - name: Accept Admin entry, real decisions, policy settings and rendered screens
        env:
          E2E_REAL_API: http://127.0.0.1:4010
          E2E_MAILPIT: http://127.0.0.1:8025
          E2E_BASE_URL: http://127.0.0.1:4173
          PLAYWRIGHT_HTML_OUTPUT_DIR: test-results/admin-real-api-report
          VERIFICATION_ENFORCED: 'true'
          WORK_ACCESS_ENFORCED: 'true'
        run: |
          pnpm --filter @homeservicemarketplace/web exec playwright test \
            e2e/admin-review-workflow.real-api.spec.ts \
            --project=chromium-desktop --workers=1 --output=test-results/admin-real-api
      - name: Upload real Admin browser evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: admin-review-real-api-evidence
          path: |
            apps/web/test-results/admin-real-api/
            apps/web/test-results/admin-real-api-report/
            /tmp/api.log
            /tmp/preview.log
          retention-days: 14
          if-no-files-found: warn

  # ── cookies / CSRF / refresh / logout, in a REAL browser ──────────────────
  # These behaviours are defined by rules only a browser implements: HttpOnly
  # hides a cookie from document.cookie, SameSite withholds it cross-site, and
  # Path scopes the refresh token. supertest and happy-dom implement none of
  # that, so they will happily pass a cookie contract Chromium refuses to
  # honour. This job is the only place that check is real.
  browser-auth-e2e:
    name: Auth cookie contract (real browser + real API)
    runs-on: ubuntu-latest
    needs: verify
    # Bounded deliberately. Each test does a real registration, an SMTP
    # delivery and a mail-catcher poll, so the per-test budget is generous;
    # without a job ceiling a hung suite would sit on a runner for GitHub's
    # 6-hour default instead of failing in a coffee break.
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: homeservicemarketplace
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports: ['1025:1025', '8025:8025']
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/homeservicemarketplace
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      JWT_ACCESS_SECRET: ci_only_dummy_secret_at_least_32_chars_long
      JWT_ISSUER: hsm-api
      JWT_AUDIENCE: hsm-clients
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      COOKIE_SECURE: 'false'
      COOKIE_SAMESITE: lax
      # Sprint 1's registration limiter is 5/IP/hour. Each test registers a
      # fresh account, so the suite would throttle itself out halfway through
      # and the failure would look like an auth bug. Raised for this job only.
      AUTH_REGISTER_THROTTLE_LIMIT: '200'
      # The cross-site test needs CORS to ALLOW the other origin, so that when
      # the request still arrives anonymous the cause is unambiguously the
      # cookie jar and not CORS.
      CORS_ORIGINS: http://localhost:4010,http://127.0.0.1:4010
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Generate prisma client
        run: pnpm --filter @homeservicemarketplace/database generate
      - name: Apply migrations
        run: pnpm --filter @homeservicemarketplace/database migrate:deploy
      - name: Build database package
        run: pnpm --filter @homeservicemarketplace/database build
      - name: Seed baseline roles / permissions
        run: pnpm --filter @homeservicemarketplace/database seed
      - name: Build the API
        run: pnpm --filter @homeservicemarketplace/api build
      - name: Install Chromium
        run: pnpm --filter @homeservicemarketplace/web exec playwright install --with-deps chromium
      - name: Start the API
        run: |
          node apps/api/dist/main.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4010/health/live >/dev/null; then
              echo "API is up"; exit 0
            fi
            sleep 1
          done
          echo "::error::API did not become healthy"; cat /tmp/api.log; exit 1
        env:
          NODE_ENV: development
          PORT: '4010'
      - name: Run the auth cookie contract in Chromium
        # No web build and no vite preview here: this suite navigates only to
        # the API origin (`${E2E_REAL_API}/health/live` and the cross-site
        # variant), never to the SPA. playwright.config.ts omits the webServer
        # entirely when E2E_REAL_API is set — see REAL_API_RUN there.
        #
        # The previous version set E2E_PREBUILT with no build step, so the
        # preview server started against a directory that did not exist:
        # "The directory \"dist\" does not exist". Adding a build would have
        # fixed the symptom by producing a bundle nothing ever requests.
        env:
          E2E_REAL_API: http://127.0.0.1:4010
          E2E_MAILPIT: http://127.0.0.1:8025
        run: |
          pnpm --filter @homeservicemarketplace/web exec playwright test             e2e/auth-cookies.spec.ts --project=chromium-desktop --workers=1
      - name: Upload API log and Playwright artefacts on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: browser-auth-e2e
          path: |
            /tmp/api.log
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # ── the image actually builds, boots, serves, and stops ───────────────────
  docker-image:
    name: Docker cold build + production boot
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: homeservicemarketplace
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Cold build (no cache)
        # --no-cache is the point: D-8 was a stage-ordering defect that a warm
        # cache would have hidden. The Dockerfile also asserts, at BUILD time,
        # that express and the Prisma client resolve in the deployed bundle and
        # that no sources or TypeScript toolchain shipped.
        run: docker build --no-cache -f apps/api/Dockerfile -t hsm-api:ci .

      - name: Prepare the database the container will boot against
        uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Migrate + seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/homeservicemarketplace
        run: |
          echo "DATABASE_URL=$DATABASE_URL" > .env
          pnpm --filter @homeservicemarketplace/database generate
          pnpm --filter @homeservicemarketplace/database migrate:deploy
          pnpm --filter @homeservicemarketplace/database build

      - name: Boot the production image
        # SMTP_HOST is required as of Sprint 9B.14: a production process now
        # REFUSES to boot without a mail host, because the in-memory adapter
        # would accept every message and deliver none — signup, verification and
        # password reset would each answer 202 while nothing arrived, behind a
        # green health check. This boot is production-shaped, so it configures
        # mail like production must. The host is never dialled: createTransport()
        # does not connect, and this job sends no mail.
        run: |
          docker run -d --name hsm-api-ci --network host \
            -e NODE_ENV=production -e APP_ENV=prod -e PORT=4000 -e LOG_LEVEL=info \
            -e DATABASE_URL="postgresql://postgres:postgres@localhost:5432/homeservicemarketplace" \
            -e REDIS_HOST=localhost -e REDIS_PORT=6379 \
            -e JWT_ACCESS_SECRET="ci_only_dummy_secret_at_least_32_chars_long" \
            -e REALTIME_SOCKET_IO=true \
            -e SMTP_HOST="smtp.invalid" -e SMTP_PORT=587 \
            hsm-api:ci

      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:4000/health/live >/dev/null 2>&1; then
              echo "healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::the production container never became healthy"
          docker logs hsm-api-ci
          exit 1

      - name: Readiness probe
        run: curl -fsS http://localhost:4000/health/ready

      - name: Assert the image runs as a non-root user
        run: |
          UID_OUT=$(docker exec hsm-api-ci id -u)
          echo "container uid: $UID_OUT"
          test "$UID_OUT" != "0"

      - name: Assert no boot-time module resolution failures
        run: |
          if docker logs hsm-api-ci 2>&1 | grep -qE "Cannot find module|MODULE_NOT_FOUND"; then
            echo "::error::the container logged a module resolution failure"
            docker logs hsm-api-ci
            exit 1
          fi

      - name: Graceful SIGTERM
        run: |
          docker stop -t 30 hsm-api-ci
          CODE=$(docker inspect hsm-api-ci --format '{{.State.ExitCode}}')
          echo "exit code: $CODE"
          docker logs hsm-api-ci 2>&1 | tail -20
          test "$CODE" = "0"

      - name: Upload container logs on failure
        if: failure()
        run: docker logs hsm-api-ci 2>&1 | tail -200 || true

  # ── the Compose stack a developer actually runs ───────────────────────────
  #
  # docker-image above proves the IMAGE boots. This proves the STACK works:
  # the Compose application profile, the one-shot migration job that must
  # complete before the API starts, and the two runtime flows that depend on
  # configuration this repo has got wrong before — media upload (storage paths
  # + non-root write permissions) and OTP (SMTP host resolution).
  #
  # It is a real gate, not a demo: a bad JWT/cookie/CORS/SMTP value in
  # docker-compose.yml fails HERE rather than on a new contributor's first
  # afternoon.
  compose-smoke:
    name: Compose stack smoke (migrate / boot / readiness / media / OTP)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
      # Node is used by the smoke script only to parse JSON (no jq on the
      # runner is not guaranteed) — it installs no dependencies.
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          # This is the ONE job that never installs pnpm, and setup-node v5
          # turned `package-manager-cache` on by default: it reads
          # `packageManager` from package.json, finds pnpm, and shells out to
          # it to locate the store. That failed here with
          #   Unable to locate executable file: pnpm
          # while every other job passed, because every other job runs
          # pnpm/action-setup first. Nothing is installed here, so there is no
          # store worth caching — say so rather than adding pnpm to satisfy a
          # cache this job does not use.
          package-manager-cache: false
      - name: Run the Compose smoke test
        run: bash scripts/ci/compose-smoke.sh
      - name: Dump Compose logs on failure
        if: failure()
        run: |
          docker compose -f infra/docker/docker-compose.yml --profile app ps -a || true
          docker compose -f infra/docker/docker-compose.yml --profile app logs --tail 200 || true

  # ── security ──────────────────────────────────────────────────────────────
  security-scan:
    name: Dependency, secret, and container scans
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the secret scan can diff the whole branch, not
          # just the tip commit.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Dependency audit policy regression tests
        run: pnpm security:audit:test

      - name: Full dependency audit (ZERO findings at every severity)
        # Tooling and dev dependencies are part of the supply chain too.
        # Registry failures and missing/filtered reports must fail closed.
        if: always()
        run: pnpm security:audit

      - name: Production dependency audit (ZERO findings at every severity)
        if: always()
        run: pnpm security:audit:prod

      - name: Upload complete dependency audit evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dependency-audit
          path: |
            audit-full.json
            audit-production.json
          retention-days: 30
          if-no-files-found: error

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the image to scan
        run: docker build -f apps/api/Dockerfile -t hsm-api:scan .

      - name: Generate an SBOM for the image
        # An SBOM answers "were we running the compromised version of X on the
        # 3rd?" months later, when node_modules has long since been rebuilt.
        # Generated from the IMAGE rather than the lockfile on purpose: the
        # lockfile describes what npm would install, the image describes what
        # actually shipped, including OS packages the lockfile knows nothing
        # about.
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: hsm-api:scan
          format: cyclonedx-json
          artifact-name: hsm-api-sbom.cyclonedx.json
          output-file: hsm-api-sbom.cyclonedx.json

      - name: Upload the SBOM
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sbom
          path: hsm-api-sbom.cyclonedx.json
          # Longer than the other artifacts: the value of an SBOM is entirely
          # in being able to answer a question asked long after the build.
          retention-days: 90
          if-no-files-found: warn

      - name: Container image scan (fail on unmitigated CRITICAL/HIGH)
        # aquasecurity/trivy-action publishes `v`-prefixed tags only, so the bare
        # `0.28.0` this pointed at never resolved ("Unable to resolve action").
        # Pinned to the commit SHA behind v0.36.0 rather than the tag: a mutable
        # tag on a third-party action is a write primitive into this pipeline,
        # and this action's tags have been rewritten in the past.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: hsm-api:scan
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          # Unfixed OS-package advisories cannot be actioned by this repo — a
          # base-image bump is the remedy and is tracked separately. Anything
          # with a fix available still fails the build.
          ignore-unfixed: true
          vuln-type: os,library

  # ── single required check ─────────────────────────────────────────────────
  # Branch protection points at THIS job. Adding a gate above automatically
  # tightens the requirement without anyone having to remember to update the
  # protection rule.
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      # One entry for the whole reusable verification suite: the caller job
      # fails if ANY of install / contracts / database / api / web failed.
      - verify
      - integration-e2e
      - browser-e2e
      # The approved design is an acceptance criterion, so the check that
      # measures it blocks merges like any other.
      - phase5-visual
      # Real-route and durable-persistence evidence for the six task screens.
      - phase5-real-api
      # Admin decisions and screens use a separate real service lifecycle.
      - admin-review-real-api
      # The cookie/CSRF/refresh/logout contract is a merge blocker like any
      # other. A security check that is allowed to fail is not a check.
      - browser-auth-e2e
      - docker-image
      - compose-smoke
      - security-scan
    steps:
      - name: Fail if any required job did not succeed
        run: |
          echo '${{ toJSON(needs) }}'
          if echo '${{ toJSON(needs) }}' | grep -q '"result": *"\(failure\|cancelled\|skipped\)"'; then
            echo "::error::one or more required CI jobs did not succeed"
            exit 1
          fi
          echo "all required jobs succeeded"
