        # workspace so neither copy can be mistaken for the job's main bundle.
        env:
          VITE_PROVIDER_ONBOARDING_V2: 'true'
        run: |
          cd apps/web
          VITE_API_URL=http://127.0.0.1:4011 pnpm exec vite build --outDir /tmp/r17-web-a --emptyOutDir
          VITE_API_URL=http://127.0.0.1:4012 pnpm exec vite build --outDir /tmp/r17-web-b --emptyOutDir
          grep -lq '127.0.0.1:4011' /tmp/r17-web-a/assets/*.js
          grep -lq '127.0.0.1:4012' /tmp/r17-web-b/assets/*.js
          pnpm exec vite preview --outDir /tmp/r17-web-a --host 127.0.0.1 --port 4174 --strictPort > /tmp/r17-preview-a.log 2>&1 &
          pnpm exec vite preview --outDir /tmp/r17-web-b --host 127.0.0.1 --port 4175 --strictPort > /tmp/r17-preview-b.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4174/ >/dev/null && curl -sf http://127.0.0.1:4175/ >/dev/null; then
              echo "both replica web apps are up"; exit 0
            fi
            sleep 1
          done
          echo "::error::the R17 replica web apps did not come up"
          cat /tmp/r17-preview-a.log /tmp/r17-preview-b.log; exit 1
      - name: Accept R17-A messaging across two API instances
        # Two real API processes (4011, 4012) started by the spec itself, on
        # this job's PostgreSQL and Redis. The seeker writes through replica A,
        # the provider reads and replies through replica B, the seeker moves to
        # B with the same session, replica A is stopped and started again as a
        # new process, and the committed history stays complete without a
        # duplicate. A retried send crosses replicas once; paging on one
        # replica stays complete while the other writes; a session ended on
        # one replica is refused on the other. Realtime stays off (default).
        # Synthetic people and messages; the spec records no trace or video.
        env:
          E2E_REAL_API: http://127.0.0.1:4011
          E2E_MAILPIT: http://127.0.0.1:8025
