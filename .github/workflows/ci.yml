name: CI

# Verification for pull requests into BOTH long-lived branches, and for pushes
# to them. This workflow does NOT deploy: no production secrets, no image
# pushes, no environment bindings. A green run means "safe to merge"; promotion
# to a hosted environment stays a manual, out-of-band action.
#
# Sprint 01 remediation (Phase 8) added the permanent gates that keep the
# findings closed:
#
#   integration-e2e   real Postgres / Redis, so the D-1 cross-instance
#                     rate-limit proof and the session integration tests
#                     actually run rather than being skipped.
#   browser-e2e       Playwright in a real Chromium — the RTL, badge, and
#                     geometry assertions that a DOM shim cannot make.
#   docker-image      a COLD `--no-cache` build plus a production boot, health
#                     check, and graceful SIGTERM. D-7 and D-8 were both
#                     "the image does not start" defects; only building and
#                     booting it catches them.
#   compose-smoke     the Compose app profile end to end: the migration job
#                     completes before the API starts, readiness is green, and
#                     the media-upload and OTP flows really work. Sprint 04.
#   security-scan     dependency audit, secret scan, and a container image
#                     scan that FAILS on unmitigated critical/high findings.

on:
  pull_request:
    branches: ['main', 'develop']
  push:
    branches: ['main', 'develop']
  workflow_dispatch:

# Least privilege: read-only checkout, nothing else. `security-events: write`
# is deliberately NOT granted — the scan jobs fail the build directly instead
# of uploading SARIF, so a fork PR cannot write to the security tab.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  # Placeholder values used only to satisfy zod env validation and Prisma's
  # schema loader in jobs that never open a real connection. Any job that DOES
  # need a live service declares its own.
  CI_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_db
  CI_JWT_SECRET: ci_only_dummy_secret_at_least_32_chars_long

jobs:
  # ── the shared verification suite ─────────────────────────────────────────
  # Sprint 4: these five jobs (install, contracts, database, api, web) used to
  # be written out here AND again in staging-ci.yml. They now live in one
  # reusable definition that both long-lived branches call, so "verified"
  # cannot mean two different things depending on which branch you targeted.
  #
  # This single caller expands into the same five jobs in the checks list; the
  # ci-gate below depends on the caller, which succeeds only if all five did.
  verify:
    name: Verify
    uses: ./.github/workflows/reusable-verify.yml
    with:
      node-version: '20'

  # ── integration / E2E against REAL services ───────────────────────────────
  # Without these containers the DB- and Redis-gated suites skip themselves,
  # which is exactly how a cross-instance rate-limit defect survives a green
  # pipeline.
  integration-e2e:
    name: Integration & E2E (real Postgres / Redis)
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: homeservicemarketplace
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/homeservicemarketplace
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      JWT_ACCESS_SECRET: ci_only_dummy_secret_at_least_32_chars_long
      # The gates the suites read to decide whether to run for real.
      RUN_DB_INTEGRATION: '1'
      RUN_REDIS_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Wait until Postgres and Redis actually serve queries
        # The runner's own health gate is necessary but not sufficient.
        # Postgres answers pg_isready while initdb is still finishing and then
        # drops the connection. That window is short, which is why it shows
        # up as an intermittent first-migration failure rather than a clean one.
        #
        # Each probe below is a real round trip, and it fails HERE with an
        # obvious message instead of surfacing as an inscrutable prisma or jest
        # error three steps later. Postgres is probed from the runner, so the
        # check also proves the published port; Redis has no client on the
        # runner, so its own container runs the probe.
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          # Each attempt is evaluated inside an `if`, so `set -e` cannot abort
          # the retry loop on the first (entirely expected) miss.
          await_service() {
            local name="$1"; shift
            for _ in $(seq 1 60); do
              if "$@" >/dev/null 2>&1; then
                echo "$name is serving"
                return 0
              fi
              sleep 2
            done
            echo "::error::$name did not become ready within 120s"
            return 1
          }
          await_service Postgres psql -h localhost -U postgres -d homeservicemarketplace -c 'SELECT 1'
          await_service Redis docker exec ${{ job.services.redis.id }} redis-cli ping
      - name: Write .env for the dotenv-wrapped prisma scripts
        run: |
          {
            echo "DATABASE_URL=$DATABASE_URL"
            echo "REDIS_HOST=$REDIS_HOST"
            echo "REDIS_PORT=$REDIS_PORT"
            echo "JWT_ACCESS_SECRET=$JWT_ACCESS_SECRET"
          } > .env
      - name: Generate prisma client
        run: pnpm --filter @homeservicemarketplace/database generate
      - name: Assert migrations and schema.prisma agree
        # Catches "the schema was edited but no migration was written", which is
        # how the Dispute FK drift went unnoticed for a whole sprint. It needs a
        # real shadow database, which is why it lives in this job.
        env:
          PGPASSWORD: postgres
        run: |
          # Prisma replays the migrations into this database; it must exist and
          # must not be the one the app uses.
          psql -h localhost -U postgres -c 'DROP DATABASE IF EXISTS hsm_shadow'
          psql -h localhost -U postgres -c 'CREATE DATABASE hsm_shadow'
          cd packages/database
          DIFF=$(pnpm exec prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "postgresql://postgres:postgres@localhost:5432/hsm_shadow" \
            --script 2>&1)
          echo "$DIFF"
          if ! echo "$DIFF" | grep -q "This is an empty migration"; then
            echo "::error::schema.prisma and prisma/migrations disagree - a migration is missing"
            exit 1
          fi
      - name: Apply migrations
        run: pnpm --filter @homeservicemarketplace/database migrate:deploy
      - name: Build database package
        run: pnpm --filter @homeservicemarketplace/database build
      - name: Seed baseline roles / permissions
        run: pnpm --filter @homeservicemarketplace/database seed
      - name: Verify the constraint migrations against empty and upgraded databases
        # Sprint 2. The constraint migrations are forward-only and they touch
        # existing rows, so "it applied cleanly" is not evidence for either
        # half of that: on an empty database every remediation branch and every
        # refusal branch is dead code. This builds throwaway databases and
        # drives all four scenarios, including the two where the migration is
        # supposed to REFUSE and stop the deploy.
        #
        # Deliberately its own step, before the suite rather than beside it.
        # The harness drops and creates databases on the same server the
        # integration specs are using; running the two concurrently starved
        # them badly enough to produce spurious failures (one suite took 96
        # minutes instead of 6 seconds). Steps within a job are sequential,
        # which is the isolation this needs.
        run: pnpm --filter @homeservicemarketplace/database verify:migrations
      - name: Run the API suite with the DB- and Redis-gated specs ENABLED
        run: pnpm --filter @homeservicemarketplace/api test
      - name: Upload API logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: integration-logs
          path: |
            apps/api/*.log
            npm-debug.log*
          retention-days: 7
          if-no-files-found: ignore

  # ── real browser ──────────────────────────────────────────────────────────
  browser-e2e:
    name: Browser E2E (Playwright / Chromium)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @homeservicemarketplace/web exec playwright install --with-deps chromium
      - name: Build the web app
        # Hoisted out of playwright.config.ts's webServer command. It used to run
        # inside the 300s server-startup budget, so a slow cold build and a
        # server that failed to bind produced the identical "Timed out waiting
        # for config.webServer" message. As its own step it has its own timing,
        # its own log, and its own failure.
        env:
          # The suite stubs every /v1/** call; this only satisfies the
          # production build's required-env check.
          VITE_API_URL: https://api.example.com
        run: pnpm --filter @homeservicemarketplace/web build
      - name: Run the browser suite (mobile / tablet / desktop)
        env:
          VITE_API_URL: https://api.example.com
          E2E_API_URL: https://api.example.com
          # Serve the artefact the step above produced.
          E2E_PREBUILT: '1'
        run: pnpm --filter @homeservicemarketplace/web test:e2e
      # Traces, screenshots, and videos are configured retain-on-failure, so a
      # green run uploads nothing.
      - name: Upload Playwright traces and report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # ── cookies / CSRF / refresh / logout, in a REAL browser ──────────────────
  # These behaviours are defined by rules only a browser implements: HttpOnly
  # hides a cookie from document.cookie, SameSite withholds it cross-site, and
  # Path scopes the refresh token. supertest and happy-dom implement none of
  # that, so they will happily pass a cookie contract Chromium refuses to
  # honour. This job is the only place that check is real.
  browser-auth-e2e:
    name: Auth cookie contract (real browser + real API)
    runs-on: ubuntu-latest
    needs: verify
    # Bounded deliberately. Each test does a real registration, an SMTP
    # delivery and a mail-catcher poll, so the per-test budget is generous;
    # without a job ceiling a hung suite would sit on a runner for GitHub's
    # 6-hour default instead of failing in a coffee break.
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: homeservicemarketplace
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports: ['1025:1025', '8025:8025']
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/homeservicemarketplace
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      JWT_ACCESS_SECRET: ci_only_dummy_secret_at_least_32_chars_long
      JWT_ISSUER: hsm-api
      JWT_AUDIENCE: hsm-clients
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      COOKIE_SECURE: 'false'
      COOKIE_SAMESITE: lax
      # Sprint 1's registration limiter is 5/IP/hour. Each test registers a
      # fresh account, so the suite would throttle itself out halfway through
      # and the failure would look like an auth bug. Raised for this job only.
      AUTH_REGISTER_THROTTLE_LIMIT: '200'
      # The cross-site test needs CORS to ALLOW the other origin, so that when
      # the request still arrives anonymous the cause is unambiguously the
      # cookie jar and not CORS.
      CORS_ORIGINS: http://localhost:4010,http://127.0.0.1:4010
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Generate prisma client
        run: pnpm --filter @homeservicemarketplace/database generate
      - name: Apply migrations
        run: pnpm --filter @homeservicemarketplace/database migrate:deploy
      - name: Build database package
        run: pnpm --filter @homeservicemarketplace/database build
      - name: Seed baseline roles / permissions
        run: pnpm --filter @homeservicemarketplace/database seed
      - name: Build the API
        run: pnpm --filter @homeservicemarketplace/api build
      - name: Install Chromium
        run: pnpm --filter @homeservicemarketplace/web exec playwright install --with-deps chromium
      - name: Start the API
        run: |
          node apps/api/dist/main.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4010/health/live >/dev/null; then
              echo "API is up"; exit 0
            fi
            sleep 1
          done
          echo "::error::API did not become healthy"; cat /tmp/api.log; exit 1
        env:
          NODE_ENV: development
          PORT: '4010'
      - name: Run the auth cookie contract in Chromium
        # No web build and no vite preview here: this suite navigates only to
        # the API origin (`${E2E_REAL_API}/health/live` and the cross-site
        # variant), never to the SPA. playwright.config.ts omits the webServer
        # entirely when E2E_REAL_API is set — see REAL_API_RUN there.
        #
        # The previous version set E2E_PREBUILT with no build step, so the
        # preview server started against a directory that did not exist:
        # "The directory \"dist\" does not exist". Adding a build would have
        # fixed the symptom by producing a bundle nothing ever requests.
        env:
          E2E_REAL_API: http://127.0.0.1:4010
          E2E_MAILPIT: http://127.0.0.1:8025
        run: |
          pnpm --filter @homeservicemarketplace/web exec playwright test             e2e/auth-cookies.spec.ts --project=chromium-desktop --workers=1
      - name: Upload API log and Playwright artefacts on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: browser-auth-e2e
          path: |
            /tmp/api.log
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # ── the image actually builds, boots, serves, and stops ───────────────────
  docker-image:
    name: Docker cold build + production boot
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: homeservicemarketplace
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Cold build (no cache)
        # --no-cache is the point: D-8 was a stage-ordering defect that a warm
        # cache would have hidden. The Dockerfile also asserts, at BUILD time,
        # that express and the Prisma client resolve in the deployed bundle and
        # that no sources or TypeScript toolchain shipped.
        run: docker build --no-cache -f apps/api/Dockerfile -t hsm-api:ci .

      - name: Prepare the database the container will boot against
        uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Migrate + seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/homeservicemarketplace
        run: |
          echo "DATABASE_URL=$DATABASE_URL" > .env
          pnpm --filter @homeservicemarketplace/database generate
          pnpm --filter @homeservicemarketplace/database migrate:deploy
          pnpm --filter @homeservicemarketplace/database build

      - name: Boot the production image
        run: |
          docker run -d --name hsm-api-ci --network host \
            -e NODE_ENV=production -e APP_ENV=prod -e PORT=4000 -e LOG_LEVEL=info \
            -e DATABASE_URL="postgresql://postgres:postgres@localhost:5432/homeservicemarketplace" \
            -e REDIS_HOST=localhost -e REDIS_PORT=6379 \
            -e JWT_ACCESS_SECRET="ci_only_dummy_secret_at_least_32_chars_long" \
            -e REALTIME_SOCKET_IO=true \
            hsm-api:ci

      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:4000/health/live >/dev/null 2>&1; then
              echo "healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::the production container never became healthy"
          docker logs hsm-api-ci
          exit 1

      - name: Readiness probe
        run: curl -fsS http://localhost:4000/health/ready

      - name: Assert the image runs as a non-root user
        run: |
          UID_OUT=$(docker exec hsm-api-ci id -u)
          echo "container uid: $UID_OUT"
          test "$UID_OUT" != "0"

      - name: Assert no boot-time module resolution failures
        run: |
          if docker logs hsm-api-ci 2>&1 | grep -qE "Cannot find module|MODULE_NOT_FOUND"; then
            echo "::error::the container logged a module resolution failure"
            docker logs hsm-api-ci
            exit 1
          fi

      - name: Graceful SIGTERM
        run: |
          docker stop -t 30 hsm-api-ci
          CODE=$(docker inspect hsm-api-ci --format '{{.State.ExitCode}}')
          echo "exit code: $CODE"
          docker logs hsm-api-ci 2>&1 | tail -20
          test "$CODE" = "0"

      - name: Upload container logs on failure
        if: failure()
        run: docker logs hsm-api-ci 2>&1 | tail -200 || true

  # ── the Compose stack a developer actually runs ───────────────────────────
  #
  # docker-image above proves the IMAGE boots. This proves the STACK works:
  # the Compose application profile, the one-shot migration job that must
  # complete before the API starts, and the two runtime flows that depend on
  # configuration this repo has got wrong before — media upload (storage paths
  # + non-root write permissions) and OTP (SMTP host resolution).
  #
  # It is a real gate, not a demo: a bad JWT/cookie/CORS/SMTP value in
  # docker-compose.yml fails HERE rather than on a new contributor's first
  # afternoon.
  compose-smoke:
    name: Compose stack smoke (migrate / boot / readiness / media / OTP)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
      # Node is used by the smoke script only to parse JSON (no jq on the
      # runner is not guaranteed) — it installs no dependencies.
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          # This is the ONE job that never installs pnpm, and setup-node v5
          # turned `package-manager-cache` on by default: it reads
          # `packageManager` from package.json, finds pnpm, and shells out to
          # it to locate the store. That failed here with
          #   Unable to locate executable file: pnpm
          # while every other job passed, because every other job runs
          # pnpm/action-setup first. Nothing is installed here, so there is no
          # store worth caching — say so rather than adding pnpm to satisfy a
          # cache this job does not use.
          package-manager-cache: false
      - name: Run the Compose smoke test
        run: bash scripts/ci/compose-smoke.sh
      - name: Dump Compose logs on failure
        if: failure()
        run: |
          docker compose -f infra/docker/docker-compose.yml --profile app ps -a || true
          docker compose -f infra/docker/docker-compose.yml --profile app logs --tail 200 || true

  # ── security ──────────────────────────────────────────────────────────────
  security-scan:
    name: Dependency, secret, and container scans
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the secret scan can diff the whole branch, not
          # just the tip commit.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Production dependency audit (ZERO high or critical)
        # The merge gate. --prod scopes it to what is actually deployed: a
        # dev-only advisory in vite or eslint never reaches a running artifact,
        # and blocking merges on those trains everyone to bypass the gate.
        #
        # --audit-level high means the job fails on any HIGH or CRITICAL, so
        # the passing condition is literally "zero high, zero critical in the
        # shipped tree". Sprint 3 left it at zero; anything above is a
        # regression, not a backlog item.
        run: pnpm audit --prod --audit-level high

      - name: Full dependency audit (report only, never blocks)
        # The dev tree carries ~28 highs across vite, postcss, turbo, tar and
        # friends. None of them ship, so none of them may block a merge — but
        # they must not be INVISIBLE either, or the first anyone hears of a
        # build-time compromise is after it happens. This step reports and
        # always succeeds; the artifact below is the durable record.
        if: always()
        run: |
          pnpm audit --json > audit-full.json || true
          node -e "
            const a = Object.values(JSON.parse(require('fs').readFileSync('audit-full.json','utf8')).advisories || {});
            const by = {};
            a.forEach(x => { by[x.severity] = (by[x.severity] || 0) + 1; });
            console.log('Full-tree advisories (dev included):', JSON.stringify(by));
            a.filter(x => ['critical','high'].includes(x.severity))
             .forEach(x => console.log('  ' + x.severity.toUpperCase(), x.module_name, x.vulnerable_versions, '->', x.patched_versions));
          "

      - name: Upload the full audit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dependency-audit
          path: audit-full.json
          retention-days: 30
          if-no-files-found: warn

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the image to scan
        run: docker build -f apps/api/Dockerfile -t hsm-api:scan .

      - name: Generate an SBOM for the image
        # An SBOM answers "were we running the compromised version of X on the
        # 3rd?" months later, when node_modules has long since been rebuilt.
        # Generated from the IMAGE rather than the lockfile on purpose: the
        # lockfile describes what npm would install, the image describes what
        # actually shipped, including OS packages the lockfile knows nothing
        # about.
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: hsm-api:scan
          format: cyclonedx-json
          artifact-name: hsm-api-sbom.cyclonedx.json
          output-file: hsm-api-sbom.cyclonedx.json

      - name: Upload the SBOM
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sbom
          path: hsm-api-sbom.cyclonedx.json
          # Longer than the other artifacts: the value of an SBOM is entirely
          # in being able to answer a question asked long after the build.
          retention-days: 90
          if-no-files-found: warn

      - name: Container image scan (fail on unmitigated CRITICAL/HIGH)
        # aquasecurity/trivy-action publishes `v`-prefixed tags only, so the bare
        # `0.28.0` this pointed at never resolved ("Unable to resolve action").
        # Pinned to the commit SHA behind v0.36.0 rather than the tag: a mutable
        # tag on a third-party action is a write primitive into this pipeline,
        # and this action's tags have been rewritten in the past.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: hsm-api:scan
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          # Unfixed OS-package advisories cannot be actioned by this repo — a
          # base-image bump is the remedy and is tracked separately. Anything
          # with a fix available still fails the build.
          ignore-unfixed: true
          vuln-type: os,library

  # ── single required check ─────────────────────────────────────────────────
  # Branch protection points at THIS job. Adding a gate above automatically
  # tightens the requirement without anyone having to remember to update the
  # protection rule.
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      # One entry for the whole reusable verification suite: the caller job
      # fails if ANY of install / contracts / database / api / web failed.
      - verify
      - integration-e2e
      - browser-e2e
      # The cookie/CSRF/refresh/logout contract is a merge blocker like any
      # other. A security check that is allowed to fail is not a check.
      - browser-auth-e2e
      - docker-image
      - compose-smoke
      - security-scan
    steps:
      - name: Fail if any required job did not succeed
        run: |
          echo '${{ toJSON(needs) }}'
          if echo '${{ toJSON(needs) }}' | grep -q '"result": *"\(failure\|cancelled\|skipped\)"'; then
            echo "::error::one or more required CI jobs did not succeed"
            exit 1
          fi
          echo "all required jobs succeeded"
