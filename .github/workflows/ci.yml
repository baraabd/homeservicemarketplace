        run: |
          pnpm --filter @homeservicemarketplace/web exec playwright test \
            e2e/r17-notifications.real-api.spec.ts \
            --project=chromium-desktop --workers=1 --retries=0 \
            --output=test-results/r17-b-notifications
      - name: Upload R17-B notification lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: r17-b-notifications-evidence
          path: |
            apps/web/test-results/r17-b-notifications/
            apps/web/test-results/r17-b-notifications-report/
          retention-days: 14
          if-no-files-found: error
      - name: Accept PLATFORM-TX-1 — a rejected COMMIT is never reported as success
        # The provider presses Start Job on replica A's web app; a test-only
        # deferred trigger (created and dropped by the spec, never migrated)
        # rejects that transaction at COMMIT after every statement succeeded.
        # The API must not answer success, nothing may be stored and the
        # screen must not show a started job; then the same button commits
        # once. Synthetic people; the spec records no trace or video.
        env:
          E2E_REAL_API: http://127.0.0.1:4011
          E2E_MAILPIT: http://127.0.0.1:8025
          E2E_REPLICA_A_WEB: http://127.0.0.1:4174
          PLAYWRIGHT_HTML_OUTPUT_DIR: test-results/platform-tx-commit-report
        run: |
          node scripts/runtime/reset-ci-browser-rate-limits.cjs
          pnpm --filter @homeservicemarketplace/web exec playwright test \
            e2e/platform-transaction-commit.real-api.spec.ts \
            --project=chromium-desktop --workers=1 --retries=0 \
            --output=test-results/platform-tx-commit
      - name: Upload PLATFORM-TX-1 commit-authority evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: platform-tx-commit-evidence
          path: |
            apps/web/test-results/platform-tx-commit/
            apps/web/test-results/platform-tx-commit-report/
          retention-days: 14
          if-no-files-found: error
      - name: Bring in the visual evidence, so the counters can be complete
        # Into the same tree this job wrote its own markers to. The ledger keeps
        # the two namespaces separate by path — PROVISIONAL_UI for the stubbed
        # visual run, FINAL_REAL_API for this one — so they can share a parent
        # directory without either being able to satisfy the other's checks.
        uses: actions/download-artifact@v6
        with:
          name: phase5-visual-evidence
          path: apps/web/test-results/phase5-visual/
      - name: Re-derive the counters from BOTH halves of the evidence
        # The suite writes evidence; this reads it back and re-checks every
        # claim in it — including that the recorded values agree with the
        # database read. A green Playwright run whose markers do not survive
        # independent verification is not evidence.
        run: pnpm --filter @homeservicemarketplace/web exec vitest run phase5-
      - name: Assert the counters are what the branch claims
        # The report PRINTS; this FAILS. A counter nobody asserts is a number in
        # a log, and this project has already had one pinned at 0/6 for a whole
        # phase by an argument rather than by absent evidence.
        run: |
          pnpm --filter @homeservicemarketplace/web exec vitest run \
            phase5-ledger-report --reporter=verbose 2>&1 | tee /tmp/counters.log
          # The exit status above belongs to tee; the assertion is the grep.
          for line in \
            "presentation migrated:       6/6" \
            "production-route integrated: 6/6" \
            "real-API persisted:          6/6"
          do
            if ! grep -qF "$line" /tmp/counters.log; then
              echo "::error::expected counter line not found: $line"
              grep -E "migrated:|integrated:|persisted:" /tmp/counters.log || true
              exit 1
            fi
          done
          echo "all three counters are 6/6"
      - name: Upload the real-API evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase5-real-api-evidence
          path: |
            apps/web/test-results/phase5-visual/FINAL_REAL_API/
            /tmp/api.log
            /tmp/preview.log
          retention-days: 14
          if-no-files-found: warn

  # Admin acceptance has its own disposable services. Sharing the Provider
  # job's Redis carried its completed login workload into the next suite and
  # exhausted the unchanged 10/IP/minute login budget before Admin began.
  # Isolation preserves both fresh UI/OTP entry and the real server limiter.
  admin-review-real-api:
    name: Admin review real-route and persistence evidence
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: homeservicemarketplace
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports: ['1025:1025', '8025:8025']
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/homeservicemarketplace
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      JWT_ACCESS_SECRET: ci_only_dummy_secret_at_least_32_chars_long
      JWT_ISSUER: hsm-api
      JWT_AUDIENCE: hsm-clients
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      COOKIE_SECURE: 'false'
      COOKIE_SAMESITE: lax
      # Same disposable-stack budgets as Provider acceptance. The login route
      # retains its hard 10/IP/minute limit. This single-worker suite performs
      # eight Admin UI logins, one memoized Admin API login and one Provider
      # UI login; no rate bucket is cleared or altered between tests.
      AUTH_REGISTER_THROTTLE_LIMIT: '200'
      AUTH_OTP_VERIFY_THROTTLE_LIMIT: '400'
      GLOBAL_THROTTLE_LIMIT: '5000'
      CORS_ORIGINS: http://127.0.0.1:4173,http://localhost:4173
      VERIFICATION_ENFORCED: 'true'
      WORK_ACCESS_ENFORCED: 'true'
      # Genuine uploaded bytes pass through the running worker. This test
      # scanner is forbidden in production and is not malware-detection proof.
      EVIDENCE_SCANNER_DRIVER: test
      EVIDENCE_SCAN_WORKER_ENABLED: 'true'
      EVIDENCE_SCAN_INTERVAL_MS: '1000'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Generate prisma client
        run: pnpm --filter @homeservicemarketplace/database generate
      - name: Apply migrations
        run: pnpm --filter @homeservicemarketplace/database migrate:deploy
      - name: Build database package
        run: pnpm --filter @homeservicemarketplace/database build
      - name: Seed baseline roles / permissions
        run: pnpm --filter @homeservicemarketplace/database seed
      - name: Build the API
        run: pnpm --filter @homeservicemarketplace/api build
      - name: Build the web app with V2 ON at BUILD time
        # The flag is baked into the bundle rather than set through a storage
        # override, and the route marker says so. Route evidence answers "does
        # the SHIPPED artefact serve V2" — a localStorage override answers a
        # different question, and the ledger would be recording the wrong one.
        env:
          VITE_API_URL: http://127.0.0.1:4010
          VITE_PROVIDER_ONBOARDING_V2: 'true'
        run: pnpm --filter @homeservicemarketplace/web build
      - name: Install Chromium
        run: pnpm --filter @homeservicemarketplace/web exec playwright install --with-deps chromium
      - name: Start the API
        run: |
          node apps/api/dist/main.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4010/health/live >/dev/null; then
              echo "API is up"; exit 0
            fi
            sleep 1
          done
          echo "::error::API did not become healthy"; cat /tmp/api.log; exit 1
        env:
          NODE_ENV: development
          PORT: '4010'
      - name: Serve the built SPA
        # Started here rather than by playwright's webServer, which the config
        # omits entirely for a real-API run. `--host 127.0.0.1` is load-bearing:
        # without it vite binds `localhost`, which on this runner resolves to
        # [::1] only, and every poll of 127.0.0.1 is refused by a server that is
        # running perfectly well on another interface.
        run: |
          pnpm --filter @homeservicemarketplace/web exec vite preview \
            --host 127.0.0.1 --port 4173 --strictPort > /tmp/preview.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4173/ >/dev/null; then
              echo "SPA is up"; exit 0
            fi
            sleep 1
          done
          echo "::error::vite preview did not come up"; cat /tmp/preview.log; exit 1
      - name: Accept Admin entry, real decisions, policy settings and rendered screens
        env:
          E2E_REAL_API: http://127.0.0.1:4010
          E2E_MAILPIT: http://127.0.0.1:8025
          E2E_BASE_URL: http://127.0.0.1:4173
          PLAYWRIGHT_HTML_OUTPUT_DIR: test-results/admin-real-api-report
          VERIFICATION_ENFORCED: 'true'
          WORK_ACCESS_ENFORCED: 'true'
        run: |
          pnpm --filter @homeservicemarketplace/web exec playwright test \
            e2e/admin-review-workflow.real-api.spec.ts \
            --project=chromium-desktop --workers=1 --output=test-results/admin-real-api
      - name: Upload real Admin browser evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: admin-review-real-api-evidence
          path: |
            apps/web/test-results/admin-real-api/
            apps/web/test-results/admin-real-api-report/
            /tmp/api.log
            /tmp/preview.log
          retention-days: 14
          if-no-files-found: warn

      # Keep the complete evidence above. These existing synthetic screenshots
      # also need a small independent archive for human visual inspection in
      # clients with bounded artifact-transfer sizes. No logs, traces or auth
      # material are copied into this review sample.
      - name: Upload inspectable Admin visual samples
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: admin-review-visual-samples
          path: |
            apps/web/test-results/admin-real-api/**/tabs-v1-ar-light-390-BASICS_IDENTITY.png
            apps/web/test-results/admin-real-api/**/tabs-v1-ar-dark-320-BASICS_IDENTITY.png
            apps/web/test-results/admin-real-api/**/tabs-v1-en-light-1440-BASICS_IDENTITY.png
            apps/web/test-results/admin-real-api/**/tabs-v1-en-dark-1024-BASICS_IDENTITY.png
            apps/web/test-results/admin-real-api/**/tabs-v1-ar-light-390-PORTFOLIO.png
            apps/web/test-results/admin-real-api/**/tabs-v1-en-dark-1440-PORTFOLIO.png
            apps/web/test-results/admin-real-api/**/tabs-v1-ar-light-390-REVIEW_SUBMISSION.png
            apps/web/test-results/admin-real-api/**/identity-replaced-and-current-real-api.png
            apps/web/test-results/admin-real-api/**/portfolio-inspection-ar-light-390.png
            apps/web/test-results/admin-real-api/**/portfolio-real-revision-conflict.png
          retention-days: 14
          if-no-files-found: error

  # ── cookies / CSRF / refresh / logout, in a REAL browser ──────────────────
  # These behaviours are defined by rules only a browser implements: HttpOnly
  # hides a cookie from document.cookie, SameSite withholds it cross-site, and
  # Path scopes the refresh token. supertest and happy-dom implement none of
  # that, so they will happily pass a cookie contract Chromium refuses to
  # honour. This job is the only place that check is real.
  browser-auth-e2e:
    name: Auth cookie contract (real browser + real API)
    runs-on: ubuntu-latest
    needs: verify
    # Bounded deliberately. Each test does a real registration, an SMTP
    # delivery and a mail-catcher poll, so the per-test budget is generous;
    # without a job ceiling a hung suite would sit on a runner for GitHub's
    # 6-hour default instead of failing in a coffee break.
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: homeservicemarketplace
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports: ['1025:1025', '8025:8025']
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/homeservicemarketplace
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      JWT_ACCESS_SECRET: ci_only_dummy_secret_at_least_32_chars_long
      JWT_ISSUER: hsm-api
      JWT_AUDIENCE: hsm-clients
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      COOKIE_SECURE: 'false'
      COOKIE_SAMESITE: lax
      # Sprint 1's registration limiter is 5/IP/hour. Each test registers a
      # fresh account, so the suite would throttle itself out halfway through
      # and the failure would look like an auth bug. Raised for this job only.
      AUTH_REGISTER_THROTTLE_LIMIT: '200'
      # The cross-site test needs CORS to ALLOW the other origin, so that when
      # the request still arrives anonymous the cause is unambiguously the
      # cookie jar and not CORS.
      CORS_ORIGINS: http://localhost:4010,http://127.0.0.1:4010
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Generate prisma client
        run: pnpm --filter @homeservicemarketplace/database generate
      - name: Apply migrations
        run: pnpm --filter @homeservicemarketplace/database migrate:deploy
      - name: Build database package
        run: pnpm --filter @homeservicemarketplace/database build
      - name: Seed baseline roles / permissions
        run: pnpm --filter @homeservicemarketplace/database seed
      - name: Build the API
        run: pnpm --filter @homeservicemarketplace/api build
      - name: Install Chromium
        run: pnpm --filter @homeservicemarketplace/web exec playwright install --with-deps chromium
      - name: Start the API
        run: |
          node apps/api/dist/main.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4010/health/live >/dev/null; then
              echo "API is up"; exit 0
            fi
            sleep 1
          done
          echo "::error::API did not become healthy"; cat /tmp/api.log; exit 1
        env:
          NODE_ENV: development
          PORT: '4010'
      - name: Run the auth cookie contract in Chromium
        # No web build and no vite preview here: this suite navigates only to
        # the API origin (`${E2E_REAL_API}/health/live` and the cross-site
        # variant), never to the SPA. playwright.config.ts omits the webServer
        # entirely when E2E_REAL_API is set — see REAL_API_RUN there.
        #
        # The previous version set E2E_PREBUILT with no build step, so the
        # preview server started against a directory that did not exist:
        # "The directory \"dist\" does not exist". Adding a build would have
        # fixed the symptom by producing a bundle nothing ever requests.
        env:
          E2E_REAL_API: http://127.0.0.1:4010
          E2E_MAILPIT: http://127.0.0.1:8025
        run: |
          pnpm --filter @homeservicemarketplace/web exec playwright test             e2e/auth-cookies.spec.ts --project=chromium-desktop --workers=1
      - name: Upload API log and Playwright artefacts on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: browser-auth-e2e
          path: |
            /tmp/api.log
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # ── the image actually builds, boots, serves, and stops ───────────────────
  docker-image:
    name: Docker cold build + production boot
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: homeservicemarketplace
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Cold build (no cache)
        # --no-cache is the point: D-8 was a stage-ordering defect that a warm
        # cache would have hidden. The Dockerfile also asserts, at BUILD time,
        # that express and the Prisma client resolve in the deployed bundle and
        # that no sources or TypeScript toolchain shipped.
        run: docker build --no-cache -f apps/api/Dockerfile -t hsm-api:ci .

      - name: Prepare the database the container will boot against
        uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Migrate + seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/homeservicemarketplace
        run: |
          echo "DATABASE_URL=$DATABASE_URL" > .env
          pnpm --filter @homeservicemarketplace/database generate
          pnpm --filter @homeservicemarketplace/database migrate:deploy
          pnpm --filter @homeservicemarketplace/database build

      - name: Boot the production image
        # SMTP_HOST is required as of Sprint 9B.14: a production process now
        # REFUSES to boot without a mail host, because the in-memory adapter
        # would accept every message and deliver none — signup, verification and
        # password reset would each answer 202 while nothing arrived, behind a
        # green health check. This boot is production-shaped, so it configures
        # mail like production must. The host is never dialled: createTransport()
        # does not connect, and this job sends no mail.
        run: |
          docker run -d --name hsm-api-ci --network host \
            -e NODE_ENV=production -e APP_ENV=prod -e PORT=4000 -e LOG_LEVEL=info \
            -e DATABASE_URL="postgresql://postgres:postgres@localhost:5432/homeservicemarketplace" \
            -e REDIS_HOST=localhost -e REDIS_PORT=6379 \
            -e JWT_ACCESS_SECRET="ci_only_dummy_secret_at_least_32_chars_long" \
            -e REALTIME_SOCKET_IO=true \
            -e SMTP_HOST="smtp.invalid" -e SMTP_PORT=587 \
            hsm-api:ci

      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:4000/health/live >/dev/null 2>&1; then
              echo "healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::the production container never became healthy"
          docker logs hsm-api-ci
          exit 1

      - name: Readiness probe
        run: curl -fsS http://localhost:4000/health/ready

      - name: Assert the image runs as a non-root user
        run: |
          UID_OUT=$(docker exec hsm-api-ci id -u)
          echo "container uid: $UID_OUT"
          test "$UID_OUT" != "0"

      - name: Assert no boot-time module resolution failures
        run: |
          if docker logs hsm-api-ci 2>&1 | grep -qE "Cannot find module|MODULE_NOT_FOUND"; then
            echo "::error::the container logged a module resolution failure"
            docker logs hsm-api-ci
            exit 1
          fi

      - name: Graceful SIGTERM
        run: |
          docker stop -t 30 hsm-api-ci
          CODE=$(docker inspect hsm-api-ci --format '{{.State.ExitCode}}')
          echo "exit code: $CODE"
          docker logs hsm-api-ci 2>&1 | tail -20
          test "$CODE" = "0"

      - name: Upload container logs on failure
        if: failure()
        run: docker logs hsm-api-ci 2>&1 | tail -200 || true

  # ── the Compose stack a developer actually runs ───────────────────────────
  #
  # docker-image above proves the IMAGE boots. This proves the STACK works:
  # the Compose application profile, the one-shot migration job that must
  # complete before the API starts, and the two runtime flows that depend on
  # configuration this repo has got wrong before — media upload (storage paths
  # + non-root write permissions) and OTP (SMTP host resolution).
  #
  # It is a real gate, not a demo: a bad JWT/cookie/CORS/SMTP value in
  # docker-compose.yml fails HERE rather than on a new contributor's first
  # afternoon.
  compose-smoke:
    name: Compose stack smoke (migrate / boot / readiness / media / OTP)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
      # Node is used by the smoke script only to parse JSON (no jq on the
      # runner is not guaranteed) — it installs no dependencies.
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          # This is the ONE job that never installs pnpm, and setup-node v5
          # turned `package-manager-cache` on by default: it reads
          # `packageManager` from package.json, finds pnpm, and shells out to
          # it to locate the store. That failed here with
          #   Unable to locate executable file: pnpm
          # while every other job passed, because every other job runs
          # pnpm/action-setup first. Nothing is installed here, so there is no
          # store worth caching — say so rather than adding pnpm to satisfy a
          # cache this job does not use.
          package-manager-cache: false
      - name: Run the Compose smoke test
        run: bash scripts/ci/compose-smoke.sh
      - name: Dump Compose logs on failure
        if: failure()
        run: |
          docker compose -f infra/docker/docker-compose.yml --profile app ps -a || true
          docker compose -f infra/docker/docker-compose.yml --profile app logs --tail 200 || true

  # ── security ──────────────────────────────────────────────────────────────
  security-scan:
    name: Dependency, secret, and container scans
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the secret scan can diff the whole branch, not
          # just the tip commit.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Dependency audit policy regression tests
        run: pnpm security:audit:test

      - name: Full dependency audit (ZERO findings at every severity)
        # Tooling and dev dependencies are part of the supply chain too.
        # Registry failures and missing/filtered reports must fail closed.
        if: always()
        run: pnpm security:audit

      - name: Production dependency audit (ZERO findings at every severity)
        if: always()
        run: pnpm security:audit:prod

      - name: Upload complete dependency audit evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dependency-audit
          path: |
            audit-full.json
            audit-production.json
          retention-days: 30
          if-no-files-found: error

      - name: Secret scan
        # History scan: catches a secret that was added and later removed.
        # It reads `git log --no-merges --first-parent <range>`, so it never
        # sees content introduced only by a merge commit, and on a develop
        # push (every first-parent commit is a merge) it scans 0 commits.
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tracked-tree secret scan policy tests
        if: always()
        run: node --test scripts/security/secret-scan-tree.test.cjs

      - name: Secret scan of the exact tracked source tree
        # Complements the history scan: every tracked file of the checked-out
        # commit (the PR merge ref, or the pushed develop tip) is scanned, and
        # an empty, partial or zero-byte scope fails instead of passing.
        # Pinned release, verified against its published SHA-256.
        if: always()
        env:
          GITLEAKS_VERSION: 8.24.3
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/gitleaks-tree"
          mkdir -p "$tool"
          curl -sSfL -o "$tool/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $tool/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$tool/gitleaks.tar.gz" -C "$tool" gitleaks
          node scripts/security/secret-scan-tree.cjs \
            --gitleaks "$tool/gitleaks" --work-dir "$RUNNER_TEMP/secret-scan-tree" \
            --report gitleaks-tree.sarif

      - name: Upload the tracked-tree secret scan report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: secret-scan-tree
          path: gitleaks-tree.sarif
          retention-days: 30
          if-no-files-found: warn

      - name: Build the image to scan
        run: docker build -f apps/api/Dockerfile -t hsm-api:scan .

      - name: Generate an SBOM for the image
        # An SBOM answers "were we running the compromised version of X on the
        # 3rd?" months later, when node_modules has long since been rebuilt.
        # Generated from the IMAGE rather than the lockfile on purpose: the
        # lockfile describes what npm would install, the image describes what
        # actually shipped, including OS packages the lockfile knows nothing
        # about.
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: hsm-api:scan
          format: cyclonedx-json
          artifact-name: hsm-api-sbom.cyclonedx.json
          output-file: hsm-api-sbom.cyclonedx.json

      - name: Upload the SBOM
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sbom
          path: hsm-api-sbom.cyclonedx.json
          # Longer than the other artifacts: the value of an SBOM is entirely
          # in being able to answer a question asked long after the build.
          retention-days: 90
          if-no-files-found: warn

      - name: Container image scan (fail on unmitigated CRITICAL/HIGH)
        # aquasecurity/trivy-action publishes `v`-prefixed tags only, so the bare
        # `0.28.0` this pointed at never resolved ("Unable to resolve action").
        # Pinned to the commit SHA behind v0.36.0 rather than the tag: a mutable
        # tag on a third-party action is a write primitive into this pipeline,
        # and this action's tags have been rewritten in the past.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: hsm-api:scan
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          # Unfixed OS-package advisories cannot be actioned by this repo — a
          # base-image bump is the remedy and is tracked separately. Anything
          # with a fix available still fails the build.
          ignore-unfixed: true
          vuln-type: os,library

  # Independent, disposable services. No production credentials or deployment.
  evidence-retention:
    name: Evidence retention / real Postgres, S3 versions and ClamAV
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: retention_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/retention_ci
      RUN_RETENTION_INTEGRATION: '1'
      RETENTION_TEST_S3_ENDPOINT: http://127.0.0.1:19000
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.8'
          cache: true
          cache-dependency-path: .github/minio-fixture-go.sum
      - run: pnpm install --frozen-lockfile
      - name: Start disposable scanner and create temporary storage credentials
        run: |
          docker run -d --name retention-clamd -p 127.0.0.1:3310:3310 clamav/clamav:stable
          python3 - <<'PY'
          import os, secrets
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              for key in ['RETENTION_TEST_S3_USER', 'RETENTION_TEST_S3_SECRET']:
                  value = secrets.token_hex(24)
                  print(f'::add-mask::{value}')
                  out.write(f'{key}={value}\n')
          PY
      - name: Verify MinIO fixture retry policy
        run: node --test scripts/ci/install-minio-fixture.test.cjs
      - name: Build the upstream security-fixed S3 test service
        # Test service only, not a production storage recommendation. Build the
        # exact upstream security release with its declared Go toolchain and the
        # public Go checksum database. The helper retries only recognized network
        # transport failures; compilation/checksum failures stop immediately.
        run: bash scripts/ci/install-minio-fixture.sh "$RUNNER_TEMP/retention-bin"
      - name: Start storage and verify both services actually answer
        run: |
          MINIO_ROOT_USER="$RETENTION_TEST_S3_USER" MINIO_ROOT_PASSWORD="$RETENTION_TEST_S3_SECRET" \
            "$RUNNER_TEMP/retention-bin/minio" server "$RUNNER_TEMP/retention-objects" \
            --address 127.0.0.1:19000 > "$RUNNER_TEMP/retention-minio.log" 2>&1 &
          python3 - <<'PY'
          import socket, time, urllib.request
          for attempt in range(120):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:19000/minio/health/ready', timeout=2) as response:
                      assert response.status == 200
                  with socket.create_connection(('127.0.0.1', 3310), timeout=2) as connection:
                      connection.sendall(b'zPING\0')
                      assert b'PONG' in connection.recv(100)
                  break
              except Exception:
                  if attempt == 119: raise RuntimeError('retention-test-services-not-ready') from None
                  time.sleep(3)
          PY
      - name: Generate, migrate and build the actual worker
        run: |
          echo "DATABASE_URL=$DATABASE_URL" > .env
          pnpm --filter @homeservicemarketplace/database generate
          pnpm --filter @homeservicemarketplace/database migrate:deploy
          pnpm --filter @homeservicemarketplace/database build
          pnpm --filter @homeservicemarketplace/contracts build
          pnpm --filter @homeservicemarketplace/api build
      - name: Verify erasure, recovery, authority fences and independent process
        run: |
          pnpm --filter @homeservicemarketplace/api exec jest \
            --runInBand --testPathPatterns=evidence-retention.integration \
            --json --outputFile=retention-ci-report.json
      - name: Retain synthetic test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: retention-real-services-evidence
          path: apps/api/retention-ci-report.json
          retention-days: 14
          if-no-files-found: error
      - name: Stop scanner
        if: always()
        run: docker rm -f retention-clamd || true

  # ── single required check ─────────────────────────────────────────────────
  # Branch protection points at THIS job. Adding a gate above automatically
  # tightens the requirement without anyone having to remember to update the
  # protection rule.
  dispute-workspace:
    name: Dispute journey / real HTTP, browser, Postgres and ClamAV
    runs-on: ubuntu-latest
    needs: verify
    # R17-C adds its own real-service step (about five minutes) after C-7's.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dispute_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dispute_ci
      REDIS_URL: redis://127.0.0.1:6379/13
      RUN_DB_INTEGRATION: '1'
      RUN_DISPUTE_BROWSER: '1'
      RUN_DISPUTE_WORKER: '1'
      DISPUTE_TEST_SCANNER: clamav
      CLAMAV_HOST: 127.0.0.1
      CLAMAV_PORT: '3310'
      DISPUTE_BROWSER_OUTPUT: ${{ github.workspace }}/apps/web/test-results/dispute-real-workspace
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: echo "DATABASE_URL=$DATABASE_URL" > .env
      - run: pnpm --filter @homeservicemarketplace/database generate
      - run: pnpm --filter @homeservicemarketplace/database migrate:deploy
      - run: pnpm --filter @homeservicemarketplace/database build
      - run: pnpm --filter @homeservicemarketplace/contracts build
      - run: pnpm --filter @homeservicemarketplace/api build
      - name: Install the normal CI Chromium distribution
        run: pnpm --filter @homeservicemarketplace/web exec playwright install --with-deps chromium
      - name: Start the real malware scanner
        run: |
          docker run -d --name dispute-clamd -p 127.0.0.1:3310:3310 clamav/clamav:stable
          python3 - <<'PYTHON'
          import socket,time
          for attempt in range(150):
              try:
                  with socket.create_connection(('127.0.0.1',3310),timeout=2) as sock:
                      sock.sendall(b'zPING\0')
                      if b'PONG' in sock.recv(128): break
              except OSError: pass
              if attempt == 149: raise RuntimeError('dispute-scanner-not-ready')
              time.sleep(2)
          PYTHON
      - name: Verify actual auth, CSRF, persistence, independent appeal and rendered UI
        run: |
          pnpm --filter @homeservicemarketplace/api exec jest --runInBand --runTestsByPath \
            test/integration/dispute-worker-process.integration.spec.ts \
            test/integration/dispute-workspace.integration.spec.ts \
            test/integration/dispute-decision-boundaries.integration.spec.ts \
            test/integration/dispute-private-lifecycle.integration.spec.ts \
            test/integration/dispute-workspace-http.integration.spec.ts \
            test/integration/dispute-workspace-browser.integration.spec.ts \
            --json --outputFile=dispute-workspace-ci.json
      - name: Upload evidence without credentials, traces or dependency files
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dispute-workspace-real-evidence
          path: |
            apps/api/dispute-workspace-ci.json
            apps/web/test-results/dispute-real-workspace/
          retention-days: 14
          if-no-files-found: error
      - name: R17-C dispute authority (concurrency, COMMIT, real HTTP, legacy admin browser)
        env:
          R17C_BROWSER_OUTPUT: ${{ github.workspace }}/apps/web/test-results/r17c-dispute-legacy
        # Two invocations, browser first: login is rate-limited per client IP
        # and both suites log in from 127.0.0.1, so their bursts must not
        # overlap. Each step reports separately; both must run.
        run: |
          set +e
          pnpm --filter @homeservicemarketplace/api exec jest --runInBand --runTestsByPath \
            test/integration/r17-dispute-legacy-browser.integration.spec.ts \
            --json --outputFile=r17c-disputes-browser-ci.json
          browser=$?
          pnpm --filter @homeservicemarketplace/api exec jest --runInBand --runTestsByPath \
            test/integration/r17-disputes.integration.spec.ts \
            test/integration/r17-dispute-legacy-http.integration.spec.ts \
            --json --outputFile=r17c-disputes-ci.json
          service=$?
          set -e
          # Fail closed: every R17-C case must have executed; none may be skipped.
          node -e "
            const runs = ['r17c-disputes-browser-ci.json', 'r17c-disputes-ci.json'].map((f) => require('./apps/api/' + f));
            const sum = (k) => runs.reduce((n, r) => n + r[k], 0);
            const expected = 23;
            console.log('R17-C passed', sum('numPassedTests'), 'failed', sum('numFailedTests'), 'pending', sum('numPendingTests'), 'todo', sum('numTodoTests'));
            if (sum('numFailedTests') || sum('numPendingTests') || sum('numTodoTests') || sum('numPassedTests') !== expected) {
              console.error('::error::R17-C acceptance did not execute all ' + expected + ' cases');
              process.exit(1);
            }"
          test "$browser" -eq 0 && test "$service" -eq 0 && test "$closureBrowser" -eq 0 && test "$closure" -eq 0
      - name: Upload R17-C evidence (no credentials, cookies or private evidence)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: r17c-dispute-real-evidence
          path: |
            apps/api/r17c-disputes-browser-ci.json
            apps/api/r17c-disputes-ci.json
            apps/web/test-results/r17c-dispute-legacy/
          retention-days: 14
          if-no-files-found: error
      # R17-D — admin operations. This job already provides the real AppModule
      # harness, Postgres, Redis, Chromium and the web app, so the admin
      # browser journey runs here behind its own gate rather than in a new job.
      # The real-HTTP admin spec also runs in "Integration & E2E" automatically.
      - name: R17-D admin operations (settings, analytics, audit, users, stale session)
        env:
          RUN_ADMIN_BROWSER: '1'
          R17D_BROWSER_OUTPUT: ${{ github.workspace }}/apps/web/test-results/r17d-admin-operations
        run: |
          # Admin permissions come from the seeded role/permission baseline, which
          # the earlier dispute steps never needed. Idempotent; seeded only here so
          # C-7 and R17-C keep running against exactly the database they did.
          pnpm --filter @homeservicemarketplace/database seed
          set +e
          pnpm --filter @homeservicemarketplace/api exec jest --runInBand --runTestsByPath \
            test/integration/r17-admin-operations-browser.integration.spec.ts \
            --json --outputFile=r17d-admin-browser-ci.json
          browser=$?
          pnpm --filter @homeservicemarketplace/api exec jest --runInBand --runTestsByPath \
            test/integration/r17-admin-operations.integration.spec.ts \
            --json --outputFile=r17d-admin-ci.json
          service=$?
          set -e
          # Fail closed: every R17-D case must have executed; none may be skipped.
          node -e "
            const runs = ['r17d-admin-browser-ci.json', 'r17d-admin-ci.json'].map((f) => require('./apps/api/' + f));
            const sum = (k) => runs.reduce((n, r) => n + r[k], 0);
            const expected = 14;
            console.log('R17-D passed', sum('numPassedTests'), 'failed', sum('numFailedTests'), 'pending', sum('numPendingTests'), 'todo', sum('numTodoTests'));
            if (sum('numFailedTests') || sum('numPendingTests') || sum('numTodoTests') || sum('numPassedTests') !== expected) {
              console.error('::error::R17-D acceptance did not execute all ' + expected + ' cases');
              process.exit(1);
            }"
          test "$browser" -eq 0 && test "$service" -eq 0
      - name: Upload R17-D evidence (no credentials, cookies or personal data)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: r17d-admin-real-evidence
          path: |
            apps/api/r17d-admin-browser-ci.json
            apps/api/r17d-admin-ci.json
            apps/web/test-results/r17d-admin-operations/
          retention-days: 14
          if-no-files-found: error
      # R17-E — provider surfaces. Same real-AppModule harness, Postgres, Redis,
      # Chromium and web app as the steps above, behind its own gate. Both
      # Sprint 9 work-access axes are armed inside the suites. The real-HTTP
      # specs also run in "Integration & E2E" automatically.
      # Post-merge closure: provider bookings pagination (browser + HTTP) and
      # request fan-out capability authority (E-13), counted in the same gate.
      - name: R17-E provider surfaces (feed authority, stale bids, bookings, capability loss, pagination, fan-out)
        env:
          RUN_PROVIDER_BROWSER: '1'
          R17E_BROWSER_OUTPUT: ${{ github.workspace }}/apps/web/test-results/r17e-provider-surfaces
          R17X_BROWSER_OUTPUT: ${{ github.workspace }}/apps/web/test-results/r17e-closure
        run: |
          # Roles come from the seeded baseline; idempotent, as in the R17-D step.
          pnpm --filter @homeservicemarketplace/database seed
          set +e
          pnpm --filter @homeservicemarketplace/api exec jest --runInBand --runTestsByPath \
            test/integration/r17-provider-surfaces-browser.integration.spec.ts \
            --json --outputFile=r17e-provider-browser-ci.json
          browser=$?
          pnpm --filter @homeservicemarketplace/api exec jest --runInBand --runTestsByPath \
            test/integration/r17-provider-surfaces.integration.spec.ts \
            --json --outputFile=r17e-provider-ci.json
          service=$?
          pnpm --filter @homeservicemarketplace/api exec jest --runInBand --runTestsByPath             test/integration/r17-e-closure-browser.integration.spec.ts             --json --outputFile=r17e-closure-browser-ci.json
          closureBrowser=$?
          pnpm --filter @homeservicemarketplace/api exec jest --runInBand --runTestsByPath             test/integration/r17-e-closure.integration.spec.ts             --json --outputFile=r17e-closure-ci.json
          closure=$?
          set -e
          # Fail closed: every R17-E case must have executed; none may be skipped.
          node -e "
            const files = ['r17e-provider-browser-ci.json', 'r17e-provider-ci.json', 'r17e-closure-browser-ci.json', 'r17e-closure-ci.json'];
            const runs = files.map((f) => require('./apps/api/' + f));
            const sum = (k) => runs.reduce((n, r) => n + r[k], 0);
            // 1 browser + 30 HTTP (R17-E), 1 browser + 12 HTTP (closure).
            const expected = 44;
            console.log('R17-E passed', sum('numPassedTests'), 'failed', sum('numFailedTests'), 'pending', sum('numPendingTests'), 'todo', sum('numTodoTests'));
            if (sum('numFailedTests') || sum('numPendingTests') || sum('numTodoTests') || sum('numPassedTests') !== expected) {
              console.error('::error::R17-E acceptance did not execute all ' + expected + ' cases');
              process.exit(1);
            }"
          test "$browser" -eq 0 && test "$service" -eq 0
      - name: Upload R17-E evidence (no credentials, cookies or personal data)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: r17e-provider-real-evidence
          path: |
            apps/api/r17e-provider-browser-ci.json
            apps/api/r17e-provider-ci.json
            apps/api/r17e-closure-browser-ci.json
            apps/api/r17e-closure-ci.json
            apps/web/test-results/r17e-provider-surfaces/
            apps/web/test-results/r17e-closure/
          retention-days: 14
          if-no-files-found: error
      - name: Stop the dedicated scanner
        if: always()
        run: docker rm -f dispute-clamd || true

  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      # One entry for the whole reusable verification suite: the caller job
      # fails if ANY of install / contracts / database / api / web failed.
      - verify
      - integration-e2e
      - evidence-retention
      - dispute-workspace
      - browser-e2e
      # The approved design is an acceptance criterion, so the check that
      # measures it blocks merges like any other.
      - phase5-visual
      # Real-route and durable-persistence evidence for the six task screens.
      - phase5-real-api
      # Admin decisions and screens use a separate real service lifecycle.
      - admin-review-real-api
      # The cookie/CSRF/refresh/logout contract is a merge blocker like any
      # other. A security check that is allowed to fail is not a check.
      - browser-auth-e2e
      - docker-image
      - compose-smoke
      - security-scan
    steps:
      - name: Fail if any required job did not succeed
        run: |
          echo '${{ toJSON(needs) }}'
          if echo '${{ toJSON(needs) }}' | grep -q '"result": *"\(failure\|cancelled\|skipped\)"'; then
            echo "::error::one or more required CI jobs did not succeed"
            exit 1
          fi
          echo "all required jobs succeeded"
