name: CI

# CI verification on the production branch (`main`). This workflow does
# NOT deploy. There are no production deployment secrets, no image
# pushes, no environment bindings. A green run means "the code is safe
# to merge to main"; promotion to a hosted environment is a manual,
# out-of-band action.

on:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']
  workflow_dispatch:

# Least privilege: read-only checkout, nothing else.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  verify-contracts:
    name: Verify Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build contracts
        run: pnpm --filter @homeservicemarketplace/contracts build

  verify-database:
    name: Verify Database
    runs-on: ubuntu-latest
    needs: verify-contracts
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      # The database package scripts (prisma:validate / generate) wrap
      # `dotenv -e ../../.env -- prisma <cmd>`. The CI runner has no
      # .env file, so write a stub with a placeholder DATABASE_URL.
      # Neither command connects to a real database.
      - name: Stub DATABASE_URL for prisma
        run: echo "DATABASE_URL=postgresql://ci:ci@localhost:5432/ci_db" > .env
      - name: Validate prisma schema
        run: pnpm --filter @homeservicemarketplace/database prisma:validate
      - name: Generate prisma client
        run: pnpm --filter @homeservicemarketplace/database generate
      - name: Typecheck database
        run: pnpm --filter @homeservicemarketplace/database typecheck
      - name: Build database
        run: pnpm --filter @homeservicemarketplace/database build

  verify-api:
    name: Verify API
    runs-on: ubuntu-latest
    needs: verify-database
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      # CI-runtime stub for env validation. The api ConfigModule loads at
      # test/build time and zod-validates the environment; DATABASE_URL,
      # MONGODB_URI and a ≥32-char JWT_ACCESS_SECRET are the minimum the
      # schema requires. The values are placeholders — no command in this
      # job opens a real DB / Mongo / signs a real token. The .env file
      # is workflow-scoped and never reaches the repo.
      - name: Stub env for prisma + nest config validation
        run: |
          {
            echo "DATABASE_URL=postgresql://ci:ci@localhost:5432/ci_db"
            echo "MONGODB_URI=mongodb://ci:ci@localhost:27017/ci_db"
            echo "JWT_ACCESS_SECRET=ci_only_dummy_secret_at_least_32_chars_long"
          } > .env
      # GitHub Actions jobs run on isolated runners — the generated Prisma
      # client produced by `verify-database` does NOT carry into this job.
      # The api package's `build:deps` builds the database package, which
      # imports from @prisma/client; without a generated client tsc fails
      # with "Module '@prisma/client' has no exported member 'PrismaClient'".
      # Generate the client locally inside this job so it's self-contained.
      - name: Generate prisma client (job-local)
        run: pnpm --filter @homeservicemarketplace/database generate
      - name: Lint api
        run: pnpm --filter @homeservicemarketplace/api lint
      - name: Typecheck api
        run: pnpm --filter @homeservicemarketplace/api typecheck
      - name: Test api
        run: pnpm --filter @homeservicemarketplace/api test
      - name: Build api
        run: pnpm --filter @homeservicemarketplace/api build

  verify-web:
    name: Verify Web
    runs-on: ubuntu-latest
    needs: verify-contracts
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint web
        run: pnpm --filter @homeservicemarketplace/web lint
      - name: Typecheck web
        run: pnpm --filter @homeservicemarketplace/web typecheck
      - name: Test web
        run: pnpm --filter @homeservicemarketplace/web test
      # VITE_API_URL is required at build time by apps/web/vite.config.ts.
      # The bundle is NOT deployed by this workflow.
      - name: Build web
        env:
          VITE_API_URL: https://api.example.com
        run: pnpm --filter @homeservicemarketplace/web build
