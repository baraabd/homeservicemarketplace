name: CI

# Verification for pull requests into BOTH long-lived branches, and for pushes
# to them. This workflow does NOT deploy: no production secrets, no image
# pushes, no environment bindings. A green run means "safe to merge"; promotion
# to a hosted environment stays a manual, out-of-band action.
#
# Sprint 01 remediation (Phase 8) added the permanent gates that keep the
# findings closed:
#
#   integration-e2e   real Postgres / Redis, so the D-1 cross-instance
#                     rate-limit proof and the session integration tests
#                     actually run rather than being skipped.
#   browser-e2e       Playwright in a real Chromium — the RTL, badge, and
#                     geometry assertions that a DOM shim cannot make.
#   docker-image      a COLD `--no-cache` build plus a production boot, health
#                     check, and graceful SIGTERM. D-7 and D-8 were both
#                     "the image does not start" defects; only building and
#                     booting it catches them.
#   compose-smoke     the Compose app profile end to end: the migration job
#                     completes before the API starts, readiness is green, and
#                     the media-upload and OTP flows really work. Sprint 04.
#   security-scan     dependency audit, secret scan, and a container image
#                     scan that FAILS on unmitigated critical/high findings.

on:
  pull_request:
    branches: ['main', 'develop']
  push:
    branches: ['main', 'develop']
  workflow_dispatch:

# Least privilege: read-only checkout, nothing else. `security-events: write`
# is deliberately NOT granted — the scan jobs fail the build directly instead
# of uploading SARIF, so a fork PR cannot write to the security tab.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.21.0'
  # Placeholder values used only to satisfy zod env validation and Prisma's
  # schema loader in jobs that never open a real connection. Any job that DOES
  # need a live service declares its own.
  CI_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_db
  CI_JWT_SECRET: ci_only_dummy_secret_at_least_32_chars_long

jobs:
  # ── the shared verification suite ─────────────────────────────────────────
  # Sprint 4: these five jobs (install, contracts, database, api, web) used to
  # be written out here AND again in staging-ci.yml. They now live in one
  # reusable definition that both long-lived branches call, so "verified"
  # cannot mean two different things depending on which branch you targeted.
  #
  # This single caller expands into the same five jobs in the checks list; the
  # ci-gate below depends on the caller, which succeeds only if all five did.
  verify:
    name: Verify
    uses: ./.github/workflows/reusable-verify.yml
    with:
      node-version: '24.21.0'

  # ── integration / E2E against REAL services ───────────────────────────────
  # Without these containers the DB- and Redis-gated suites skip themselves,
  # which is exactly how a cross-instance rate-limit defect survives a green
  # pipeline.
  integration-e2e:
    name: Integration & E2E (real Postgres / Redis)
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: homeservicemarketplace
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/homeservicemarketplace
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      JWT_ACCESS_SECRET: ci_only_dummy_secret_at_least_32_chars_long
      # The gates the suites read to decide whether to run for real.
      RUN_DB_INTEGRATION: '1'
      RUN_REDIS_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Wait until Postgres and Redis actually serve queries
        # The runner's own health gate is necessary but not sufficient.
        # Postgres answers pg_isready while initdb is still finishing and then
        # drops the connection. That window is short, which is why it shows
        # up as an intermittent first-migration failure rather than a clean one.
        #
        # Each probe below is a real round trip, and it fails HERE with an
        # obvious message instead of surfacing as an inscrutable prisma or jest
        # error three steps later. Postgres is probed from the runner, so the
        # check also proves the published port; Redis has no client on the
        # runner, so its own container runs the probe.
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          # Each attempt is evaluated inside an `if`, so `set -e` cannot abort
          # the retry loop on the first (entirely expected) miss.
          await_service() {
            local name="$1"; shift
            for _ in $(seq 1 60); do
              if "$@" >/dev/null 2>&1; then
                echo "$name is serving"
                return 0
              fi
              sleep 2
            done
            echo "::error::$name did not become ready within 120s"
            return 1
          }
          await_service Postgres psql -h localhost -U postgres -d homeservicemarketplace -c 'SELECT 1'
          await_service Redis docker exec ${{ job.services.redis.id }} redis-cli ping
      - name: Write .env for the dotenv-wrapped prisma scripts
        run: |
          {
            echo "DATABASE_URL=$DATABASE_URL"
            echo "REDIS_HOST=$REDIS_HOST"
            echo "REDIS_PORT=$REDIS_PORT"
            echo "JWT_ACCESS_SECRET=$JWT_ACCESS_SECRET"
          } > .env
      - name: Generate prisma client
        run: pnpm --filter @homeservicemarketplace/database generate
      - name: Assert migrations and schema.prisma agree
        # Catches "the schema was edited but no migration was written", which is
        # how the Dispute FK drift went unnoticed for a whole sprint. It needs a
        # real shadow database, which is why it lives in this job.
        env:
          PGPASSWORD: postgres
        run: |
          # Prisma replays the migrations into this database; it must exist and
          # must not be the one the app uses.
          psql -h localhost -U postgres -c 'DROP DATABASE IF EXISTS hsm_shadow'
          psql -h localhost -U postgres -c 'CREATE DATABASE hsm_shadow'
          cd packages/database
          DIFF=$(pnpm exec prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "postgresql://postgres:postgres@localhost:5432/hsm_shadow" \
            --script 2>&1)
          echo "$DIFF"
          if ! echo "$DIFF" | grep -q "This is an empty migration"; then
            echo "::error::schema.prisma and prisma/migrations disagree - a migration is missing"
            exit 1
          fi
      - name: Apply migrations
        run: pnpm --filter @homeservicemarketplace/database migrate:deploy
      - name: Build database package
        run: pnpm --filter @homeservicemarketplace/database build
      - name: Seed baseline roles / permissions
        run: pnpm --filter @homeservicemarketplace/database seed
      - name: Verify the constraint migrations against empty and upgraded databases
        # Sprint 2. The constraint migrations are forward-only and they touch
        # existing rows, so "it applied cleanly" is not evidence for either
        # half of that: on an empty database every remediation branch and every
        # refusal branch is dead code. This builds throwaway databases and
        # drives all four scenarios, including the two where the migration is
        # supposed to REFUSE and stop the deploy.
        #
        # Deliberately its own step, before the suite rather than beside it.
        # The harness drops and creates databases on the same server the
        # integration specs are using; running the two concurrently starved
        # them badly enough to produce spurious failures (one suite took 96
        # minutes instead of 6 seconds). Steps within a job are sequential,
        # which is the isolation this needs.
        run: pnpm --filter @homeservicemarketplace/database verify:migrations
      - name: Run the API suite with the DB- and Redis-gated specs ENABLED
        run: pnpm --filter @homeservicemarketplace/api test
      - name: Upload API logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: integration-logs
          path: |
            apps/api/*.log
            npm-debug.log*
          retention-days: 7
          if-no-files-found: ignore

  # ── real browser ──────────────────────────────────────────────────────────
  browser-e2e:
    name: Browser E2E (Playwright / Chromium)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @homeservicemarketplace/web exec playwright install --with-deps chromium
      - name: Check native Vite development startup and recovery
        run: pnpm --filter @homeservicemarketplace/web test:dev-startup
      - name: Build the web app
        # Hoisted out of playwright.config.ts's webServer command. It used to run
        # inside the 300s server-startup budget, so a slow cold build and a
        # server that failed to bind produced the identical "Timed out waiting
        # for config.webServer" message. As its own step it has its own timing,
        # its own log, and its own failure.
        env:
          # The suite stubs every /v1/** call; this only satisfies the
          # production build's required-env check.
          VITE_API_URL: https://api.example.com
        run: pnpm --filter @homeservicemarketplace/web build
      - name: Run the browser suite (mobile / tablet / desktop)
        env:
          VITE_API_URL: https://api.example.com
          E2E_API_URL: https://api.example.com
          # Serve the artefact the step above produced.
          E2E_PREBUILT: '1'
        run: pnpm --filter @homeservicemarketplace/web test:e2e
      # Admin review tests also capture successful EN/AR responsive screens for
      # visual review. Retain those alongside failure traces on every run.
      - name: Upload Playwright report and visual evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # ── the approved design, measured ─────────────────────────────────────────
  # Sprint 09B.29 Phase 5B. The visual gate produced its evidence only on a
  # developer's machine, which meant the one check that can tell whether the
  # shipped screens still match the approved prototype was never a merge
  # blocker. A gate that does not run in CI is a gate somebody remembers to run.
  #
  # It is its own job rather than a step inside browser-e2e because it is a
  # different kind of check with a different failure mode: browser-e2e asserts
  # behaviour, this one asserts appearance and accessibility against a frozen
  # reference, and its artifacts are images a human has to look at.
  phase5-visual:
    name: Phase 5 visual, responsive and accessibility gate
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @homeservicemarketplace/web exec playwright install --with-deps chromium
      - name: Build the web app
        env:
          VITE_API_URL: https://api.example.com
        run: pnpm --filter @homeservicemarketplace/web build
      - name: Capture and measure the 18 approved states
        # Single worker, deliberately. The matrix captures screenshots, and
        # parallel browsers on a 2-core runner contend for CPU badly enough to
        # change antialiasing at the margins — which is a difference in the
        # measurement apparatus, not in the product.
        env:
          VITE_API_URL: https://api.example.com
          E2E_API_URL: https://api.example.com
          E2E_PREBUILT: '1'
          E2E_PHASE5: '1'
        run: |
          pnpm --filter @homeservicemarketplace/web exec playwright test \
            phase5-visual phase5-responsive phase5-reference \
            --project=chromium-desktop --workers=1
      - name: Re-derive the ledger counters from the artifacts just produced
        # The suite writes evidence; this reads it back and recomputes every
        # ratio from the decoded pixels. A green Playwright run whose artifacts
        # do not survive independent verification is not evidence.
        run: pnpm --filter @homeservicemarketplace/web exec vitest run phase5-
      - name: Upload the visual evidence
        # ALWAYS, not only on failure. A passing run's contact sheets are what
        # a reviewer needs in order to agree that the screens are right — the
        # ratio says they are identical to the reference, not that the
        # reference was the right thing to copy.
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase5-visual-evidence
          path: |
            apps/web/test-results/phase5-visual/
          retention-days: 14
          if-no-files-found: warn

  # ── the six task journeys, against a real server ──────────────────────────
  # Sprint 09B.29 Phase 5B. The persistence suite has driven all six task
  # screens against a real API for two sprints and the Phase 5 ledger reported
  # route 0/6 and persistence 0/6 the whole time — because no spec ever wrote
  # the markers it reads. This job is where that evidence is produced.
  #
  # It is deliberately a SEPARATE job from browser-e2e: that one stubs every
  # /v1/** call and can never earn route credit, and mixing the two in one job
  # would put a stubbed run and an un-stubbed one in the same artifact tree.
  phase5-real-api:
    name: Phase 5 real-route and persistence evidence
    runs-on: ubuntu-latest
    # Also on phase5-visual, so this job can hold BOTH halves of the evidence.
    # The counters are only meaningful together: route credit requires
    # presentation credit, and presentation credit lives in PROVISIONAL_UI,
    # which this job does not produce. Before this dependency existed, the
    # visual job could print 6/6, 0/6, 0/6 and this one 0/6, 0/6, 0/6, and
    # neither number was the project's — the real 6/6/6 existed only on a
    # developer's machine, where both artifact sets happened to be present.
    needs: [verify, phase5-visual]
    # Each test registers a real account, waits on a real SMTP delivery and
    # drives a full browser journey. Generous per test, bounded per job.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: homeservicemarketplace
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports: ['1025:1025', '8025:8025']
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/homeservicemarketplace
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      JWT_ACCESS_SECRET: ci_only_dummy_secret_at_least_32_chars_long
      JWT_ISSUER: hsm-api
      JWT_AUDIENCE: hsm-clients
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      COOKIE_SECURE: 'false'
      COOKIE_SAMESITE: lax
      # Every test registers a fresh account; Sprint 1's 5/IP/hour limiter
      # would throttle the suite out halfway and the failure would look like an
      # auth bug. Raised for this job only.
      AUTH_REGISTER_THROTTLE_LIMIT: '200'
      # And every one of those accounts must then VERIFY, against a 20/minute
      # limiter that had no override until Sprint 09B.29 Phase 5B. The pair
      # being inconsistent is what broke this job: accounts could be created
      # freely and then not confirmed. Eight of that run's twelve failures were
      # the same 429 and the rest were downstream of it — including a PATCH
      # rejected for a malformed `version`, which was simply the unauthenticated
      # draft read one call earlier.
      #
      # Production refuses to boot above 20 (env.validation.ts), so this value is
      # reachable only in a disposable environment like this one.
      AUTH_OTP_VERIFY_THROTTLE_LIMIT: '400'
      # The coarse 100/minute backstop every route sits behind. Twenty-three
      # real browser journeys from one runner address is not abuse, but at this
      # layer it is indistinguishable from it — and it was the SECOND 429 this
      # job hit, on GET /onboarding/draft, once the OTP limiter was fixed. The
      # route-level guards in front of it are untouched by this value, and
      # production refuses to boot above 100.
      GLOBAL_THROTTLE_LIMIT: '5000'
      # The browser is served from 4173 and talks to the API on 4010, so the
      # API has to allow that origin or every request arrives anonymous.
      CORS_ORIGINS: http://127.0.0.1:4173,http://localhost:4173
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Verify disposable browser rate-budget isolation
        run: node --test scripts/runtime/reset-ci-browser-rate-limits.test.cjs
      - name: Generate prisma client
        run: pnpm --filter @homeservicemarketplace/database generate
      - name: Apply migrations
        run: pnpm --filter @homeservicemarketplace/database migrate:deploy
      - name: Build database package
        run: pnpm --filter @homeservicemarketplace/database build
      - name: Seed baseline roles / permissions
        run: pnpm --filter @homeservicemarketplace/database seed
      - name: Build the API
        run: pnpm --filter @homeservicemarketplace/api build
      - name: Build the web app with V2 ON at BUILD time
        # The flag is baked into the bundle rather than set through a storage
        # override, and the route marker says so. Route evidence answers "does
        # the SHIPPED artefact serve V2" — a localStorage override answers a
        # different question, and the ledger would be recording the wrong one.
        env:
          VITE_API_URL: http://127.0.0.1:4010
          VITE_PROVIDER_ONBOARDING_V2: 'true'
        run: pnpm --filter @homeservicemarketplace/web build
      - name: Install Chromium
        run: pnpm --filter @homeservicemarketplace/web exec playwright install --with-deps chromium
      - name: Start the API
        run: |
          node apps/api/dist/main.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4010/health/live >/dev/null; then
              echo "API is up"; exit 0
            fi
            sleep 1
          done
          echo "::error::API did not become healthy"; cat /tmp/api.log; exit 1
        env:
          NODE_ENV: development
          PORT: '4010'
      - name: Serve the built SPA
        # Started here rather than by playwright's webServer, which the config
        # omits entirely for a real-API run. `--host 127.0.0.1` is load-bearing:
        # without it vite binds `localhost`, which on this runner resolves to
        # [::1] only, and every poll of 127.0.0.1 is refused by a server that is
        # running perfectly well on another interface.
        run: |
          pnpm --filter @homeservicemarketplace/web exec vite preview \
            --host 127.0.0.1 --port 4173 --strictPort > /tmp/preview.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4173/ >/dev/null; then
              echo "SPA is up"; exit 0
            fi
            sleep 1
          done
          echo "::error::vite preview did not come up"; cat /tmp/preview.log; exit 1
      - name: Drive the six task journeys and record the evidence
        env:
          E2E_REAL_API: http://127.0.0.1:4010
          E2E_MAILPIT: http://127.0.0.1:8025
          E2E_BASE_URL: http://127.0.0.1:4173
        run: |
          pnpm --filter @homeservicemarketplace/web exec playwright test \
            e2e/provider-onboarding-v2-real-api.spec.ts \
            e2e/provider-onboarding-v2-persistence.spec.ts \
            --project=chromium-desktop --workers=1
      - name: Accept repaired Provider input, session gates and rendered screens
        env:
          E2E_REAL_API: http://127.0.0.1:4010
          E2E_MAILPIT: http://127.0.0.1:8025
          E2E_BASE_URL: http://127.0.0.1:4173
          PLAYWRIGHT_HTML_OUTPUT_DIR: test-results/provider-repairs-report
        run: |
          # Independent suites share one loopback login IP in disposable CI.
          # Expire only rate counters between suites; keep limits and sessions.
          node scripts/runtime/reset-ci-browser-rate-limits.cjs
          pnpm --filter @homeservicemarketplace/web exec playwright test \
            e2e/provider-onboarding-repairs.real-api.spec.ts \
            --project=chromium-desktop --workers=1 --output=test-results/provider-repairs
      - name: Upload Provider repair runtime evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: provider-onboarding-repairs-real-api-evidence
          path: |
            apps/web/test-results/provider-repairs/
            apps/web/test-results/provider-repairs-report/
          retention-days: 14
          if-no-files-found: warn
      - name: Accept R05 seeker profile, address and catalog durability
        env:
          E2E_REAL_API: http://127.0.0.1:4010
          E2E_MAILPIT: http://127.0.0.1:8025
          E2E_BASE_URL: http://127.0.0.1:4173
          PLAYWRIGHT_HTML_OUTPUT_DIR: test-results/r05-seeker-real-api-report
        run: |
          # Independent suites share one loopback login IP in disposable CI.
          # Expire only rate counters between suites; keep limits and sessions.
          node scripts/runtime/reset-ci-browser-rate-limits.cjs
          pnpm --filter @homeservicemarketplace/web exec playwright test \
            e2e/r05-seeker-durability.real-api.spec.ts \
            --project=chromium-desktop --workers=1 --output=test-results/r05-seeker-real-api
      - name: Upload R05 seeker real-service evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: r05-seeker-real-api-evidence
          path: |
            apps/web/test-results/r05-seeker-real-api/
            apps/web/test-results/r05-seeker-real-api-report/
          retention-days: 14
          if-no-files-found: warn
      - name: Repeat the R05 seeker journey in one bounded batch
        # The profile editor once overwrote typed fields when a refetch landed
        # late, about one run in five. That ordering is pinned by deterministic
        # unit tests; this batch is supplementary evidence from the real stack,
        # not a proof of race freedom. Five repetitions, no retries, stop at
        # the first failure, and its own output directory so no repetition can
        # overwrite the evidence of another. It does not replace the step above.
        env:
          E2E_REAL_API: http://127.0.0.1:4010
          E2E_MAILPIT: http://127.0.0.1:8025
          E2E_BASE_URL: http://127.0.0.1:4173
          PLAYWRIGHT_HTML_OUTPUT_DIR: test-results/r05-seeker-stability-report
        run: |
          # Independent suites share one loopback login IP in disposable CI.
          # Expire only rate counters between suites; keep limits and sessions.
          node scripts/runtime/reset-ci-browser-rate-limits.cjs
          pnpm --filter @homeservicemarketplace/web exec playwright test \
            e2e/r05-seeker-durability.real-api.spec.ts \
            --project=chromium-desktop --workers=1 --retries=0 --repeat-each=5 --max-failures=1 \
            --output=test-results/r05-seeker-stability
      - name: Upload R05 stability batch evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: r05-seeker-stability-evidence
          path: |
            apps/web/test-results/r05-seeker-stability/
            apps/web/test-results/r05-seeker-stability-report/
          retention-days: 14
          if-no-files-found: warn
      - name: Accept R06 request media authority through the real browser and API
        # The wizard uploads real bytes to the real signed-upload route, the API
        # verifies what was stored, and the spec reads Postgres directly. It
        # also drives the refusal cases against the real HTTP stack.
        env:
          E2E_REAL_API: http://127.0.0.1:4010
          E2E_MAILPIT: http://127.0.0.1:8025
          E2E_BASE_URL: http://127.0.0.1:4173
          PLAYWRIGHT_HTML_OUTPUT_DIR: test-results/r06-request-media-real-api-report
        run: |
          # Independent suites share one loopback login IP in disposable CI.
          # Expire only rate counters between suites; keep limits and sessions.
          node scripts/runtime/reset-ci-browser-rate-limits.cjs
          pnpm --filter @homeservicemarketplace/web exec playwright test \
            e2e/r06-request-media.real-api.spec.ts \
            --project=chromium-desktop --workers=1 --output=test-results/r06-request-media-real-api
      - name: Upload R06 request media real-service evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: r06-request-media-real-api-evidence
          path: |
