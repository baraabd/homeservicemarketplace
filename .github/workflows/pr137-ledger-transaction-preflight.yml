name: PR 137 caller transaction preflight (not for merge)

on:
  push:
    branches: ['work/pr137-schema-preflight-232f5a1']
    paths: ['.github/workflows/pr137-ledger-transaction-preflight.yml']

permissions:
  contents: read

jobs:
  caller-transaction:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: r15_before
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d r15_before"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/r15_before
      NODE_ENV: test
      APP_ENV: test
      JWT_ACCESS_SECRET: isolated_ledger_test_only_key_at_least_32_characters
      AUTH_ANTI_ENUM_DELAY_MS: '0'
      OUTBOX_WORKER_ENABLED: 'false'
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: postgres
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: '61f5bf7ee14c3e432abb16a67a54a05c456e3579'
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '24.21.0'
          cache: pnpm
      - name: Install pinned source and prepare disposable database
        run: |
          node scripts/runtime/toolchain.cjs
          pnpm install --frozen-lockfile
          printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .env
          pnpm --filter @homeservicemarketplace/database generate
          pnpm --filter @homeservicemarketplace/database build
          pnpm --filter @homeservicemarketplace/database migrate:deploy
          psql -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE r15_after'
      - name: Fetch the reviewed immutable regression and patch blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          files = {
              'bb8778134fde0cfa88e8524271255d6b55cc1a11': pathlib.Path('apps/api/test/support/ledger-caller-transaction.cases.ts'),
              '98c71999657dd42af4b1d34fae34ab8f8bf636c4': pathlib.Path(os.environ['RUNNER_TEMP'], 'r15-patch.py'),
          }
          for sha, path in files.items():
              req = urllib.request.Request(
                  'https://api.github.com/repos/baraabd/homeservicemarketplace/git/blobs/' + sha,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'},
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  result = json.load(response)
              data = base64.b64decode(result['content'])
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              path.write_bytes(data)
          PY
          python3 "$RUNNER_TEMP/r15-patch.py" tests
      - name: Reproduce transaction escape on the unchanged ledger service
        env:
          RUN_DB_INTEGRATION: '1'
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const {spawnSync} = require('node:child_process');
          const output = path.join(process.env.RUNNER_TEMP, 'ledger-before.json');
          const result = spawnSync('pnpm', [
            '--filter', '@homeservicemarketplace/api', 'exec', 'jest',
            'test/integration/r15-ledger.integration.spec.ts', '--runInBand',
            '--testNamePattern=caller-owned transaction', '--json', '--outputFile=' + output,
          ], {encoding:'utf8', maxBuffer:32*1024*1024});
          assert.ifError(result.error);
          assert.equal(result.status, 1, 'Original implementation must fail the new regression');
          assert(fs.existsSync(output), result.stderr);
          const report = JSON.parse(fs.readFileSync(output, 'utf8'));
          const cases = report.testResults.flatMap(x => x.assertionResults)
            .filter(x => x.title.startsWith('caller-owned transaction'));
          console.log(JSON.stringify(cases.map(x => ({name:x.title,status:x.status})), null, 2));
          for (const c of cases.filter(x => x.status === 'failed')) {
            console.log(c.title + '\n' + c.failureMessages.join('\n'));
          }
          assert.equal(cases.length, 7, 'All seven new cases must execute');
          assert.equal(cases.filter(x => x.status === 'failed').length, 6);
          assert.equal(cases.filter(x => x.status === 'passed').length, 1);
          console.log('REPRODUCED: six caller-transaction failures with real PostgreSQL.');
          NODE
      - name: Apply narrow transaction enlistment and document ownership
        run: |
          python3 "$RUNNER_TEMP/r15-patch.py" service
          pnpm exec prettier --write \
            apps/api/src/modules/money/ledger/ledger.service.ts \
            apps/api/test/integration/r15-ledger.integration.spec.ts \
            apps/api/test/support/ledger-caller-transaction.cases.ts \
            docs/production-readiness/r15/ACCOUNTING_POLICY.md
          git diff --check
          git diff --exit-code -- pnpm-lock.yaml packages/database/prisma/migrations packages/database/prisma/schema.prisma
      - name: Typecheck lint and build the candidate
        run: |
          pnpm --filter @homeservicemarketplace/api typecheck
          pnpm --filter @homeservicemarketplace/api lint
          pnpm --filter @homeservicemarketplace/api build
      - name: Accept the complete ledger suite on a fresh database
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/r15_after
          RUN_DB_INTEGRATION: '1'
        run: |
          printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .env
          pnpm --filter @homeservicemarketplace/database migrate:deploy
          pnpm --filter @homeservicemarketplace/api exec jest \
            test/integration/r15-ledger.integration.spec.ts \
            src/modules/money/ledger/ledger.service.spec.ts --runInBand
      - name: Publish only the verified source blobs (no commit or ref write)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          paths = [
              'apps/api/src/modules/money/ledger/ledger.service.ts',
              'apps/api/test/integration/r15-ledger.integration.spec.ts',
              'apps/api/test/support/ledger-caller-transaction.cases.ts',
              'docs/production-readiness/r15/ACCOUNTING_POLICY.md',
          ]
          result = {}
          for path in paths:
              data = pathlib.Path(path).read_bytes()
              expected = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              req = urllib.request.Request(
                  'https://api.github.com/repos/baraabd/homeservicemarketplace/git/blobs',
                  data=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode(),
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json', 'Content-Type':'application/json'},
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  returned = json.load(response)
              assert returned['sha'] == expected
              result[path] = expected
          print('VERIFIED_LEDGER_BLOBS=' + json.dumps(result, sort_keys=True))
          PY
