name: Sprint 12 implementation workspace
on:
  push:
    branches: [feat/sprint12-dispute-intake-foundation]
    paths: [.github/workflows/sprint12-workspace.yml]
permissions:
  contents: read
jobs:
  dependency-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - run: pnpm install --frozen-lockfile
      - name: Archive dependency directories only
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/sprint12-tooling"
          find . -name node_modules -type d -prune -print0 | tar --null -T - -czf "$RUNNER_TEMP/sprint12-tooling/dependencies.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/sprint12-tooling/commit.txt"
          sha256sum pnpm-lock.yaml > "$RUNNER_TEMP/sprint12-tooling/lockfile.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: sprint12-dependency-tooling
          path: ${{ runner.temp }}/sprint12-tooling/
          retention-days: 1
          if-no-files-found: error
