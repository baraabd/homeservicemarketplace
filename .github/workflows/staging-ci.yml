name: Staging CI

# CI-only verification for the staging branch (`develop`). This workflow
# does NOT deploy. It runs the full package-scoped quality gate set so a
# bad commit on develop is caught at PR time, but no deployment, image
# push, or external system call happens here.
#
# Vercel automatic Git deployments are disabled at the project level via
# apps/web/vercel.json:`git.deploymentEnabled = false`, so a green run
# here does NOT trigger a hosted preview either.

on:
  push:
    branches: ['develop']
  pull_request:
    branches: ['develop']
  workflow_dispatch:

# Least privilege: this workflow only reads the repo. No write scopes,
# no package publishing, no environment binding.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  verify-contracts:
    name: Verify Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build contracts
        run: pnpm --filter @homeservicemarketplace/contracts build

  verify-database:
    name: Verify Database
    runs-on: ubuntu-latest
    needs: verify-contracts
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      # The database package's scripts (prisma:validate, generate) wrap
      # `dotenv -e ../../.env -- prisma <cmd>`. CI runners have no .env,
      # so write a stub at repo root with a placeholder DATABASE_URL —
      # `prisma validate` / `prisma generate` only need the variable to
      # exist; neither connects to a real database.
      - name: Stub DATABASE_URL for prisma
        run: echo "DATABASE_URL=postgresql://ci:ci@localhost:5432/ci_db" > .env
      - name: Validate prisma schema
        run: pnpm --filter @homeservicemarketplace/database prisma:validate
      - name: Generate prisma client
        run: pnpm --filter @homeservicemarketplace/database generate
      - name: Typecheck database
        run: pnpm --filter @homeservicemarketplace/database typecheck
      - name: Build database
        run: pnpm --filter @homeservicemarketplace/database build

  verify-api:
    name: Verify API
    runs-on: ubuntu-latest
    needs: verify-database
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Stub DATABASE_URL for prisma (build:deps invokes database build)
        run: echo "DATABASE_URL=postgresql://ci:ci@localhost:5432/ci_db" > .env
      - name: Lint api
        run: pnpm --filter @homeservicemarketplace/api lint
      - name: Typecheck api
        run: pnpm --filter @homeservicemarketplace/api typecheck
      - name: Test api
        run: pnpm --filter @homeservicemarketplace/api test
      - name: Build api
        run: pnpm --filter @homeservicemarketplace/api build

  verify-web:
    name: Verify Web
    runs-on: ubuntu-latest
    needs: verify-contracts
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint web
        run: pnpm --filter @homeservicemarketplace/web lint
      - name: Typecheck web
        run: pnpm --filter @homeservicemarketplace/web typecheck
      - name: Test web
        run: pnpm --filter @homeservicemarketplace/web test
      # Production-parity build. VITE_API_URL is required at build time
      # by apps/web/vite.config.ts; staging uses an HTTPS placeholder so
      # the build validator passes. The bundle is NOT deployed.
      - name: Build web
        env:
          VITE_API_URL: https://api.staging.example.com
        run: pnpm --filter @homeservicemarketplace/web build
