name: Verify Staging

on:
  push:
    branches: ['develop']
  workflow_dispatch:

concurrency:
  group: verify-staging
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  verify-staging:
    name: Verify Staging
    runs-on: ubuntu-latest
    environment:
      name: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm --filter @homeservicemarketplace/web build

      - name: Staging gate
        run: echo "Staging verification passed. Vercel handles preview deployment."
