worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  sendfile on;
  # R18 — compress text responses. Hashed bundles are the largest transfer.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;
  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    # A location with its own add_header drops the server-level ones, so each
    # such location repeats all security headers.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    # Other directives are enforced by build-bound CSP metadata before resources.
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'none'" always;
    location = /health/live { access_log off; return 204; }
    location = /build-info.json {
      add_header Cache-Control 'no-store';
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      # Other directives are enforced by build-bound CSP metadata before resources.
      add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'none'" always;
    }
    # The SPA fallback below redirects internally to /index.html, so deep
    # links get this no-store too and never pin an old bundle list.
    location = /index.html {
      add_header Cache-Control 'no-store';
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      # Other directives are enforced by build-bound CSP metadata before resources.
      add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'none'" always;
    }
    # Vite content-hashes every file here, so a name never changes meaning.
    # Without "always", a missing asset's 404 is not cached.
    location /assets/ {
      try_files $uri =404;
      add_header Cache-Control 'public, max-age=31536000, immutable';
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      # Other directives are enforced by build-bound CSP metadata before resources.
      add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'none'" always;
    }
    # Missing API routing must fail, not masquerade as an HTML 200 response.
    location /v1 { return 404; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
