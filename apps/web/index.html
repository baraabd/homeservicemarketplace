<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>On-Demand Home Services Marketplace</title>
  </head>

  <body>
    <div id="root">
      <!-- Replaced by React after the application modules load successfully. -->
      <main
        style="
          max-width: 32rem;
          margin: 20vh auto;
          padding: 1.5rem;
          text-align: center;
          font-family: system-ui, sans-serif;
        "
      >
        <div id="startup-loading" role="status">
          <p lang="ar" dir="rtl">جارٍ تحميل التطبيق…</p>
          <p>Loading the application…</p>
        </div>
        <div id="startup-error" hidden>
          <div role="alert">
            <p lang="ar" dir="rtl">تعذّر بدء التطبيق. أعد تحميل الصفحة للمحاولة مجددًا.</p>
            <p>The application could not start. Reload the page to try again.</p>
          </div>
          <button id="startup-retry" type="button">إعادة المحاولة / Retry</button>
        </div>
        <noscript
          >Please enable JavaScript to use this application. يرجى تفعيل JavaScript.</noscript
        >
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
